<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EAE0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236B7052'/%3E%3Cpath d='M32 15 L51 32 H45 V49 H36 V39 H28 V49 H19 V32 H13 Z' fill='%23F1EAE0'/%3E%3C/svg%3E">
<title>Verbouwhub</title>
<style>
:root{--zand:#F1EAE0;--card:#FBF7F0;--ink:#2E2921;--ink2:#7A7062;--olijf:#6B7052;--salie:#A2A886;--klei:#B4674E;--honing:#BE9055;--lijn:#E2D8C6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--zand);color:var(--ink);font:16px/1.5 system-ui,'Segoe UI',sans-serif;padding-bottom:78px;overscroll-behavior-y:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header{padding:20px 0 4px}
header h1{font-size:20px;font-weight:650;letter-spacing:.2px}
main{padding:14px 0 18px;min-height:60vh}
main.swiping{transition:opacity .12s}
.card{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:15px 16px;margin-bottom:12px}
.kop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 0 8px}
.kop h2{font-size:15px;font-weight:650;color:var(--ink)}
.kop .som{font-size:13.5px;color:var(--ink2)}
.groot{font-size:32px;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--ink2);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--lijn);background:#F5EFE4;color:var(--ink2);white-space:nowrap;cursor:pointer}
.chip.groen{background:#E9EBE0;border-color:#C9CDB4;color:#4C513A}
.chip.klei{background:#F2E3DC;border-color:#DDBBAD;color:#8C4A35}
.chip.honing{background:#F3E8D5;border-color:#DFC9A3;color:#8A6428}
.chip.actief{background:var(--olijf);border-color:var(--olijf);color:#FDFBF6;font-weight:600}
.subnav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rij{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--lijn);cursor:pointer}
.rij:first-of-type{border-top:0}
.rij .naam{font-weight:600}
.rij .meta{color:var(--ink2);font-size:13px}
.bedragen{display:flex;gap:14px;font-size:13.5px;flex-wrap:wrap}
.bedragen b{font-weight:650}
.balkwrap{background:#EADFCE;border-radius:6px;height:10px;overflow:hidden;margin-top:6px}
.balk{height:100%;background:var(--honing);border-radius:6px}
.fasekaart .fnaam{font-weight:600;font-size:14.5px}
.fasekaart .fsom{color:var(--ink2);font-size:13px}
.plrij{display:grid;grid-template-columns:126px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--lijn);cursor:pointer;font-size:13.5px}
.plrij:first-of-type{border-top:0}
.plspoor{background:#EADFCE;border-radius:5px;height:9px;position:relative;overflow:hidden}
.plbalk{position:absolute;top:0;height:9px;border-radius:5px}
.mijlp{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--lijn);cursor:pointer}
.mijlp:first-child{border-top:0}
.ruit{color:var(--klei);font-size:15px;line-height:1.4;flex:0 0 auto}
.addbtn{position:fixed;right:16px;bottom:76px;width:52px;height:52px;border-radius:50%;background:var(--klei);color:#FDFBF6;border:0;font-size:27px;line-height:1;cursor:pointer;z-index:30;box-shadow:0 2px 8px rgba(46,41,33,.25)}
bottomnav{display:none}
.botnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--lijn);display:grid;grid-template-columns:repeat(5,1fr);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.botnav button{background:none;border:0;padding:9px 2px 8px;font:inherit;font-size:10.5px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.botnav button.on{color:var(--olijf);font-weight:650}
.botnav .dot{width:7px;height:7px;border-radius:50%;background:var(--klei);position:absolute;margin-left:14px;margin-top:-2px}
.taak{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--lijn)}
.taak:first-child{border-top:0}
.taak input{width:19px;height:19px;margin-top:2px;accent-color:var(--olijf);flex:0 0 auto}
.taak .tt{cursor:pointer}
.taak.klaar .tt{color:var(--ink2);text-decoration:line-through}
.leeg{color:var(--ink2);text-align:center;padding:30px 0}
#overlay,#modal{position:fixed;inset:0;background:rgba(46,41,33,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#overlay.show,#modal.show{display:flex}
.paneel{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.paneel h3{font-size:17px;margin-bottom:12px}
.paneel label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 3px}
.paneel input,.paneel select,.paneel textarea{width:100%;padding:9px 10px;border:1px solid var(--lijn);border-radius:8px;background:#FFFDF8;font:inherit;font-size:15px;color:var(--ink)}
.paneel textarea{min-height:74px;resize:vertical}
.knoppen{display:flex;gap:8px;margin-top:16px}
.knoppen button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--lijn);background:#F5EFE4;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.knoppen .prim{background:var(--olijf);border-color:var(--olijf);color:#FDFBF6;font-weight:600}
.knoppen .del{background:none;border-color:#DDBBAD;color:var(--klei);flex:0 0 auto;padding:11px 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#FDFBF6;padding:9px 16px;border-radius:9px;font-size:14px;display:none;z-index:50}
.pinvak{text-align:center}
.pinvak input{font-size:22px;text-align:center;letter-spacing:6px;margin-top:8px}
.subs{color:var(--olijf);font-weight:600}
.loc{font-size:12px;color:var(--ink2);background:#F5EFE4;border-radius:6px;padding:3px 8px;display:inline-block;margin-top:5px;word-break:break-all}
.weekstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.weekstrip::-webkit-scrollbar{display:none}
.dagkaart{flex:0 0 108px;background:var(--card);border:1px solid var(--lijn);border-radius:10px;padding:8px;cursor:pointer}
.dagkaart.actief{border:2px solid var(--olijf);background:#FFFDF8}
.dknaam{font-size:12.5px;font-weight:650;color:var(--ink)}
.dkmut{font-size:10.5px;color:var(--ink2);margin-top:2px}
.dkwarn{font-size:10.5px;color:#8C4A35;margin-top:2px;font-weight:600}
.veilig{background:#F2E3DC;border:1px solid #DDBBAD;border-radius:9px;padding:2px 10px;margin:8px 0}
.veilig .taak{border-top-color:#E7CFC1}
.veilig .taak:first-child{border-top:0}
.betrij{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--lijn);font-size:13.5px}
.betrij:first-of-type{border-top:0}
.betnieuw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.betnieuw input,.betnieuw select{padding:7px 8px;font-size:13px}
.bestrij{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--lijn);font-size:13px}
.bestrij:first-of-type{border-top:0}
.bestrij a{color:var(--ink);text-decoration:underline;cursor:pointer}
label.upl{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:8px;border:1px dashed var(--lijn);background:#F5EFE4;color:var(--ink2);font-size:12.5px;cursor:pointer;text-align:center;width:100%}
label.upl input{display:none}
.alert{background:#F2E3DC;border:1px solid #DDBBAD;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.alert b{color:#8C4A35;font-size:13px}
.alert div{font-size:12.5px;color:#8C4A35;margin-top:3px}
.fasekop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;cursor:pointer;border-top:1px solid var(--lijn)}
.fasekop:first-child{border-top:0}
.fasekop b{font-size:14px}
@media(min-width:720px){
  header h1{font-size:26px}
  .rij{grid-template-columns:1fr auto auto;align-items:center}
  .twee{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .plrij{grid-template-columns:170px 1fr auto}
  .dagkaart{flex-basis:130px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Verbouwhub</h1>
  </header>
  <main id="main"><div class="leeg">Laden…</div></main>
</div>
<nav class="botnav" id="botnav"></nav>
<button class="addbtn" id="addbtn" title="Nieuw">+</button>
<div id="overlay"><div class="paneel pinvak"><h3>Verbouwhub</h3><div class="mut">Voer de pincode in</div><input id="pininput" inputmode="numeric" autocomplete="off" placeholder="••••••"><div class="knoppen"><button class="prim" id="pinok">Openen</button></div></div></div>
<div id="modal"><div class="paneel" id="mpaneel"></div></div>
<div id="toast"></div>
<script>
var API = 'https://joqjslpebnpgghoybdar.supabase.co/functions/v1/verbouw/api';
var SUPA_URL = 'https://joqjslpebnpgghoybdar.supabase.co';
var TOPTABS = [
  ['start','Start'],
  ['plannen','Plannen'],
  ['doen','Doen'],
  ['geld','Geld'],
  ['dossier','Dossier']
];
var S = { data:null, tab:'start', subtabs:{doen:'taken',geld:'budget',dossier:'besluiten'}, klusdagFocus:null, budgetOpen:{}, pin: localStorage.getItem('vb_pin') || '' };
var EUR0 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var EUR2 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
var DNL = new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',year:'numeric'});
var DNLKORT = new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'short'});
function eur(n,dec){ if(n==null||isNaN(n)) return '—'; return (dec?EUR2:EUR0).format(n); }
function dnl(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); return isNaN(d)?'':DNL.format(d); }
function klusdagLabel(k){ var d=new Date(k.datum+'T00:00:00'); return isNaN(d)?k.datum:DNLKORT.format(d); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtBytes(n){ if(n==null) return ''; if(n<1024) return n+' B'; if(n<1024*1024) return Math.round(n/1024)+' KB'; return (n/1024/1024).toFixed(1)+' MB'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v==null) return null; var s=String(v).trim(); if(s==='') return null; var n=parseFloat(s.replace(',','.')); return isNaN(n)?null:n; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';},2600); }
function best(p){ if(p.werkelijk!=null) return +p.werkelijk; if(p.offerte!=null) return +p.offerte; if(p.begroot!=null) return +p.begroot; return null; }
function fasen(){ var m={}; (S.data&&S.data.fases||[]).forEach(function(f){ m[f.nummer]=f.naam; }); return m; }
function faseNaam(f){ if(f==null) return 'Algemeen'; var m=fasen(); return f+'. '+(m[f]||('Fase '+f)); }
function betaaldVoorPost(postId){ var t=0; (S.data.betalingen||[]).forEach(function(b){ if(b.post_id===postId && b.status==='betaald') t+=+b.bedrag; }); return t; }

function api(body){
  body.pin = S.pin;
  return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    if(r.status===401){ showPin(true); throw new Error('Pincode onjuist'); }
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Er ging iets mis'); return j; });
  });
}
function laad(){ return api({action:'all'}).then(function(d){ S.data=d; render(); }).catch(function(e){ if(String(e.message).indexOf('Pincode')<0) toast(e.message); }); }
function showPin(fout){
  document.getElementById('overlay').className='show';
  var inp=document.getElementById('pininput'); inp.value=''; inp.focus();
  if(fout) toast('Pincode onjuist');
}
document.getElementById('pinok').onclick = probeerPin;
document.getElementById('pininput').addEventListener('keydown',function(e){ if(e.key==='Enter') probeerPin(); });
function probeerPin(){
  S.pin = document.getElementById('pininput').value.trim();
  localStorage.setItem('vb_pin', S.pin);
  document.getElementById('overlay').className='';
  laad();
}

function huidigeStaat(){ return {tab:S.tab, subtabs:Object.assign({},S.subtabs)}; }
function gaNaarTab(tab){
  if(S.tab===tab){ window.scrollTo(0,0); return; }
  S.tab=tab;
  history.pushState(huidigeStaat(),'','#'+tab);
  render();
  window.scrollTo(0,0);
}
function gaNaarSubtab(tab, sub){
  S.tab=tab; S.subtabs[tab]=sub;
  history.pushState(huidigeStaat(),'','#'+tab+'-'+sub);
  render();
}
window.addEventListener('popstate', function(e){
  if(e.state){ S.tab=e.state.tab; S.subtabs=Object.assign(S.subtabs, e.state.subtabs||{}); }
  else { S.tab='start'; }
  render();
});

function render(){
  var nav=document.getElementById('botnav'); nav.innerHTML='';
  TOPTABS.forEach(function(t){
    var b=document.createElement('button');
    if(S.tab===t[0]) b.className='on';
    b.innerHTML=esc(t[1]);
    b.onclick=function(){ gaNaarTab(t[0]); };
    nav.appendChild(b);
  });
  var m=document.getElementById('main');
  if(!S.data){ m.innerHTML='<div class="leeg">Laden…</div>'; return; }
  var r={start:rStart,plannen:rPlannen,doen:rDoen,geld:rGeld,dossier:rDossier};
  m.innerHTML=r[S.tab]();
  koppel(m);
}
function subnav(groep, items){
  var actief=S.subtabs[groep];
  var h='<div class="subnav">';
  items.forEach(function(it){
    h+='<span class="chip'+(actief===it[0]?' actief':'')+'" data-subtab="'+groep+':'+it[0]+'">'+it[1]+'</span>';
  });
  h+='</div>';
  return h;
}
function sommen(){
  var b=0,o=0,w=0,sub=0,netto=0,betaald=0;
  S.data.posten.forEach(function(p){
    var bb=best(p);
    if(p.type==='subsidie'){ if(bb!=null) sub+=bb; }
    else{
      if(p.begroot!=null) b+=+p.begroot;
      if(p.offerte!=null) o+=+p.offerte;
      if(p.werkelijk!=null) w+=+p.werkelijk;
      if(bb!=null) netto+=bb;
      betaald+=betaaldVoorPost(p.id);
    }
  });
  var netTotaal=netto-sub;
  return {begroot:b, offerte:o, werkelijk:w, subsidie:sub, netto:netTotaal, betaald:betaald, openstaand:netTotaal-betaald};
}
function openTaken(){ return S.data.taken.filter(function(t){return t.status!=='klaar';}).slice().sort(function(a,b){ return (a.volgorde||100)-(b.volgorde||100); }); }

function rStart(){
  var vandaag=todayISO();
  var alerts=[];
  var overdueItems=S.data.items.filter(function(i){return i.nodig_voor && i.nodig_voor<vandaag && i.status==='nodig';});
  overdueItems.forEach(function(i){ alerts.push(i.naam+' had geregeld moeten zijn vóór '+dnl(i.nodig_voor)); });
  var eerstK=S.data.klusdagen.filter(function(k){return k.datum>=vandaag;})[0];
  if(eerstK){
    var ploegC=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===eerstK.id;}).length;
    var takenC=S.data.taken.filter(function(t){return t.klusdag_id===eerstK.id;}).length;
    if(!ploegC && takenC) alerts.push(klusdagLabel(eerstK)+' heeft nog niemand ingepland');
  }
  var h='';
  if(alerts.length){
    h+='<div class="alert"><b>⚠ '+alerts.length+' ding'+(alerts.length===1?'':'en')+' vraagt aandacht</b>';
    alerts.slice(0,3).forEach(function(a){ h+='<div>'+esc(a)+'</div>'; });
    h+='</div>';
  }
  var hf=S.data.fases.find(function(f){return f.status==='bezig';})||S.data.fases.find(function(f){return f.status==='gepland';});
  if(hf) h+='<div class="card"><div class="mut">Waar we staan</div><div style="margin-top:4px"><b>'+esc(hf.nummer+'. '+hf.naam)+'</b> <span class="chip '+(hf.status==='bezig'?'honing':'')+'">'+esc(hf.status)+'</span>'+(hf.start?'<span class="mut"> · '+dnl(hf.start)+' – '+dnl(hf.eind)+'</span>':'')+'</div></div>';
  if(eerstK){
    var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===eerstK.id;});
    var taken=S.data.taken.filter(function(t){return t.klusdag_id===eerstK.id;});
    var klaar=taken.filter(function(t){return t.status==='klaar';}).length;
    h+='<div class="card" data-goto="plannen" style="cursor:pointer"><div style="display:flex;justify-content:space-between"><b>Volgende klusdag · '+klusdagLabel(eerstK)+'</b><span class="mut">→</span></div>';
    h+='<div class="mut" style="margin-top:3px">'+(ploeg.length?ploeg.length+' helpers':'nog niemand')+(taken.length?' · '+klaar+'/'+taken.length+' klussen klaar':'')+(eerstK.starttijd?' · start '+String(eerstK.starttijd).slice(0,5):'')+'</div>';
    if(taken.length) h+='<div class="balkwrap"><div class="balk" style="width:'+Math.round(klaar/taken.length*100)+'%"></div></div>';
    h+='</div>';
  }
  h+='<div class="kop"><h2>Nu doen</h2><span class="som" data-goto="doen" style="cursor:pointer">alles →</span></div><div class="card">';
  var open=openTaken().slice(0,5);
  if(!open.length) h+='<div class="leeg">Alles klaar ✔</div>';
  open.forEach(function(t){ h+='<div class="taak" data-edit="taken:'+t.id+'"><span class="chip">'+esc(t.fase==null?'alg':'F'+t.fase)+'</span><span class="tt">'+esc(t.titel)+'</span></div>'; });
  h+='</div>';
  var s=sommen();
  h+='<div class="card" data-goto="geld" style="cursor:pointer"><div class="mut">Geldstand</div><div style="display:flex;justify-content:space-between;margin-top:4px"><b>betaald '+eur(s.betaald)+'</b><b style="color:var(--klei)">nog te betalen '+eur(s.openstaand)+'</b></div>';
  h+='<div class="balkwrap"><div class="balk" style="width:'+Math.max(0,Math.min(100,Math.round(s.betaald/(s.netto||1)*100)))+'%"></div></div></div>';
  var lb=S.data.besluiten[0];
  if(lb) h+='<div class="card" data-goto-sub="dossier:besluiten" style="cursor:pointer"><div class="mut">Laatste besluit</div><b>'+esc(lb.titel)+'</b><div class="mut" style="margin-top:3px">'+dnl(lb.datum)+'</div></div>';
  return h;
}

function rPlanning(){
  var met=S.data.fases.filter(function(f){return f.start&&f.eind;});
  var h='<div class="kop"><h2>Fase-tijdlijn</h2></div><div class="card">';
  var minT=null,maxT=null;
  met.forEach(function(f){ var a=+new Date(f.start),b=+new Date(f.eind); if(minT==null||a<minT)minT=a; if(maxT==null||b>maxT)maxT=b; });
  var span=(maxT>minT)?(maxT-minT):1;
  S.data.fases.forEach(function(f){
    var kleur=f.status==='klaar'?'#6B7052':(f.status==='bezig'?'#BE9055':'#A2A886');
    h+='<div class="plrij" data-edit="fases:'+f.id+'"><span>'+f.nummer+'. '+esc(f.naam)+'</span>';
    if(f.start&&f.eind&&minT!=null){
      var l=Math.round((+new Date(f.start)-minT)/span*100), w=Math.max(3,Math.round((+new Date(f.eind)-+new Date(f.start))/span*100));
      h+='<div class="plspoor"><div class="plbalk" style="left:'+l+'%;width:'+Math.min(w,100-l)+'%;background:'+kleur+'"></div></div><span class="mut">'+dnl(f.start)+' – '+dnl(f.eind)+'</span>';
    } else {
      h+='<div class="plspoor"></div><span class="chip">nog plannen</span>';
    }
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="kop"><h2>Mijlpalen</h2></div><div class="card">';
  if(!S.data.mijlpalen.length) h+='<div class="leeg">Nog geen mijlpalen</div>';
  S.data.mijlpalen.forEach(function(m){

    var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===k.id;});
    var taken=S.data.taken.filter(function(t){return t.klusdag_id===k.id;});
    var klaar=taken.filter(function(t){return t.status==='klaar';}).length;
    var items=S.data.items.filter(function(i){return i.klusdag_id===k.id;});

    h+='<div class="dkmut">'+(taken.length? klaar+'/'+taken.length+' klussen':'geen klussen')+'</div>';
    if(overdue) h+='<div class="dkwarn">⚠ regelpunt</div>';

    h+='<div class="kop" style="margin:14px 0 4px"><h2>Gelukt</h2><span class="som">'+gelukt.length+'</span></div>';

    gelukt.forEach(function(t){ h+='<div class="taak klaar"><input type="checkbox" checked data-check="'+t.id+'"><div><span class="tt" data-edit="taken:'+t.id+'">'+esc(t.titel)+'</span>'+(t.trekker?' <span class="chip groen">'+esc(t.trekker)+'</span>':'')+'</div></div>'; });
    h+='<div class="kop" style="margin:14px 0 4px"><h2>Nog doen</h2><span class="som">'+nogdoen.length+'</span></div>';

      h+='<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap"><select data-trekker-sel="'+t.id+'" style="font-size:11px;padding:3px 6px;width:auto"><option value="">wie? ▾</option>';

    items.forEach(function(i){

      h+='<div class="mut" style="padding:4px 0">'+esc(b.tekst)+' <span class="chip">'+tag+'</span></div>';

  h+='<div class="kop"><h2>Nog in te plannen</h2><span class="som">'+ongepland.length+'</span></div><div class="card">';

  ongepland.forEach(function(t){
    h+='<div class="taak"><div style="flex:1"><span class="tt" data-edit="taken:'+t.id+'">'+(t.is_veiligheid?'⚠ ':'')+esc(t.titel)+'</span>';
    h+='<div style="margin-top:4px"><select data-verplaats="'+t.id+'" style="font-size:11px;padding:3px 6px;width:auto"><option value="">plan op dag ▾</option>';
    S.data.klusdagen.forEach(function(kd){ h+='<option value="'+kd.id+'">'+klusdagLabel(kd)+'</option>'; });
    h+='</select></div></div></div>';
  });
  h+='</div>';
  return h;

function rBudget(){
  var s=sommen();
  var h='<div class="card"><div class="bedragen"><span>Begroot <b>'+eur(s.begroot)+'</b></span><span>Offertes <b>'+eur(s.offerte)+'</b></span><span>Betaald <b>'+eur(s.betaald)+'</b></span><span class="subs">Nog te betalen '+eur(s.openstaand)+'</span></div></div>';
  var groepen={};
  S.data.posten.forEach(function(p){ (groepen[p.fase]=groepen[p.fase]||[]).push(p); });
  var actieveFaseNum=(S.data.fases.find(function(f){return f.status==='bezig';})||S.data.fases.find(function(f){return f.status==='gepland';})||{}).nummer;
  Object.keys(groepen).sort().forEach(function(f){
    var lijst=groepen[f], som=0;
    lijst.forEach(function(p){ var bb=best(p); if(bb!=null) som+= (p.type==='subsidie'? -bb : bb); });
    var faseNum=f==='null'?null:+f;
    if(S.budgetOpen[f]===undefined) S.budgetOpen[f]=(faseNum===actieveFaseNum || faseNum==null);
    var open=S.budgetOpen[f];
    h+='<div class="fasekop" data-fase-toggle="'+f+'"><b>'+(open?'▾':'▸')+' '+esc(faseNaam(faseNum))+'</b><span class="mut">'+eur(som)+'</span></div>';
    if(open){
      h+='<div class="card">';
      lijst.forEach(function(p){
        var st=p.status==='betaald'?'groen':(p.status==='akkoord'?'honing':'');
        var betaaldP=betaaldVoorPost(p.id);
        h+='<div class="rij" data-edit="posten:'+p.id+'"><div><div class="naam">'+(p.type==='subsidie'?'⬇ ':'')+esc(p.naam)+'</div><div class="meta">'+esc([p.ruimte,p.leverancier].filter(Boolean).join(' · '))+(betaaldP>0?' · betaald '+eur(betaaldP):'')+'</div></div>';
        h+='<div class="bedragen"><span>B '+eur(p.begroot)+'</span><span>O '+eur(p.offerte)+'</span><span>W <b>'+eur(p.werkelijk)+'</b></span></div>';
        h+='<div><span class="chip '+st+'">'+esc(p.status)+'</span></div></div>';
      });
      h+='</div>';
    }
  });
  return h;
}

function koppel(m){
  m.querySelectorAll('[data-edit]').forEach(function(el){
    el.addEventListener('click',function(ev){
      if(ev.target.closest('[data-check],[data-cycle],[data-mcycle],[data-verplaats],[data-trekker-sel],[data-ploeg-remove],[data-ploeg-open],[data-bevinding-open],[data-kopieer],[data-download],[data-verwijder-bestand],[data-upload-offerte]')) return;
      var p=el.getAttribute('data-edit').split(':');
      openForm(p[0], p[1]);
    });
  });
  m.querySelectorAll('[data-check]').forEach(function(el){
    el.addEventListener('change',function(){
      api({action:'update',table:'taken',id:el.getAttribute('data-check'),data:{status: el.checked?'klaar':'open'}}).then(laad).catch(function(e){toast(e.message);});
    });
  });
  m.querySelectorAll('[data-cycle]').forEach(function(el){
    el.addEventListener('click',function(){
      var it=S.data.items.find(function(x){return x.id===el.getAttribute('data-cycle');});
      var volgende={nodig:'besteld',besteld:'in_huis',in_huis:'nodig'}[it.status]||'nodig';
      api({action:'update',table:'items',id:it.id,data:{status:volgende}}).then(laad).catch(function(e){toast(e.message);});
    });
  });
  m.querySelectorAll('[data-mcycle]').forEach(function(el){
    el.addEventListener('click',function(){
      var mp=S.data.mijlpalen.find(function(x){return x.id===el.getAttribute('data-mcycle');});
      api({action:'update',table:'mijlpalen',id:mp.id,data:{status: mp.status==='gehaald'?'gepland':'gehaald'}}).then(laad).catch(function(e){toast(e.message);});
    });
  });
  m.querySelectorAll('[data-goto-day]').forEach(function(el){
    el.addEventListener('click',function(){ S.klusdagFocus=el.getAttribute('data-goto-day'); render(); });
  });
  m.querySelectorAll('[data-goto]').forEach(function(el){
    el.addEventListener('click',function(){ gaNaarTab(el.getAttribute('data-goto')); });
  });
  m.querySelectorAll('[data-goto-sub]').forEach(function(el){
    el.addEventListener('click',function(){ var p=el.getAttribute('data-goto-sub').split(':'); gaNaarSubtab(p[0],p[1]); });
  });
  m.querySelectorAll('[data-subtab]').forEach(function(el){
    el.addEventListener('click',function(){ var p=el.getAttribute('data-subtab').split(':'); gaNaarSubtab(p[0],p[1]); });
  });
  m.querySelectorAll('[data-fase-toggle]').forEach(function(el){
    el.addEventListener('click',function(){ var f=el.getAttribute('data-fase-toggle'); S.budgetOpen[f]=!S.budgetOpen[f]; render(); });
  });
  m.querySelectorAll('[data-ploeg-remove]').forEach(function(el){
    el.addEventListener('click',function(){ api({action:'delete',table:'klusdag_ploeg',id:el.getAttribute('data-ploeg-remove')}).then(laad).catch(function(e){toast(e.message);}); });
  });
  m.querySelectorAll('[data-ploeg-open]').forEach(function(el){
    el.addEventListener('click',function(){ openPloegForm(el.getAttribute('data-ploeg-open')); });
  });
  m.querySelectorAll('[data-bevinding-open]').forEach(function(el){
    el.addEventListener('click',function(){ openBevindingForm(el.getAttribute('data-bevinding-open')); });
  });
  m.querySelectorAll('[data-kopieer]').forEach(function(el){
    el.addEventListener('click',function(){ kopieerDagbriefing(el.getAttribute('data-kopieer')); });
  });

var swipeX=null, swipeY=null;
document.getElementById('main').addEventListener('touchstart',function(e){
  if(e.target.closest('.weekstrip')){ swipeX=null; return; }
  swipeX=e.touches[0].clientX; swipeY=e.touches[0].clientY;
},{passive:true});
document.getElementById('main').addEventListener('touchend',function(e){
  if(swipeX==null) return;
  var dx=e.changedTouches[0].clientX-swipeX, dy=e.changedTouches[0].clientY-swipeY;
  swipeX=null;
  if(Math.abs(dx)>65 && Math.abs(dx)>Math.abs(dy)*1.4){
    var idx=TOPTABS.findIndex(function(t){return t[0]===S.tab;});
    var nieuw=dx<0?Math.min(idx+1,TOPTABS.length-1):Math.max(idx-1,0);

  }
},{passive:true});

function downloadBestand(path){
  api({action:'download_url',path:path}).then(function(r){
    var u=r.signedUrl; if(u && u.indexOf('http')!==0) u=SUPA_URL+u;
    window.open(u,'_blank');
  }).catch(function(e){ toast(e.message); });
}
function uploadBestand(offerteId, file){
  toast('Uploaden…');
  api({action:'upload_url', offerte_id:offerteId, bestandsnaam:file.name, content_type:file.type}).then(function(r){
    var u=r.signedUrl; if(u && u.indexOf('http')!==0) u=SUPA_URL+u;
    return fetch(u,{method:'PUT',headers:{'content-type':file.type||'application/octet-stream'},body:file}).then(function(resp){
      if(!resp.ok) throw new Error('Upload mislukt ('+resp.status+')');
      return api({action:'insert',table:'bestanden',data:{offerte_id:offerteId,bestandsnaam:file.name,storage_path:r.path,grootte:file.size,content_type:file.type}});
    });
  }).then(function(){ toast('Geupload'); laad(); }).catch(function(e){ toast(e.message); });
}

  var iDatum=document.createElement('input'); iDatum.type='date';

      links.innerHTML='<b>'+eur(+b.bedrag,true)+'</b> <span class="mut">'+(b.datum?dnl(b.datum):'')+(b.omschrijving?' · '+esc(b.omschrijving):'')+'</span>';
      var rechts=document.createElement('div'); rechts.style.display='flex'; rechts.style.gap='6px'; rechts.style.alignItems='center';
      var chip=document.createElement('span'); chip.className='chip '+(b.status==='betaald'?'groen':'honing'); chip.textContent=b.status; chip.style.cursor='pointer';
      chip.onclick=function(){ api({action:'update',table:'betalingen',id:b.id,data:{status:b.status==='betaald'?'gepland':'betaald'}}).then(function(){ return laad(); }).then(ververs); };
      var wis=document.createElement('span'); wis.textContent='✕'; wis.style.cssText='cursor:pointer;color:var(--klei);padding:0 4px';
      wis.onclick=function(){ if(confirm('Termijn verwijderen?')) api({action:'delete',table:'betalingen',id:b.id}).then(function(){ return laad(); }).then(ververs); };
      rechts.appendChild(chip); rechts.appendChild(wis);
      r.appendChild(links); r.appendChild(rechts);
      lijst.appendChild(r);
    });
  }
  bToevoegen.onclick=function(){
    var bedrag=num(iBedrag.value);
    if(bedrag==null){ toast('Vul een bedrag in'); return; }
    api({action:'insert',table:'betalingen',data:{post_id:postId,bedrag:bedrag,datum:iDatum.value||todayISO(),omschrijving:iOms.value||null,status:'gepland'}}).then(function(){
      iBedrag.value=''; iDatum.value=''; iOms.value='';
      return laad();
    }).then(ververs).catch(function(e){ toast(e.message); });
  };
  ververs();
  pan.appendChild(wrap);
}

function kopieerDagbriefing(klusdagId){
  var NL=String.fromCharCode(10);
  var k=S.data.klusdagen.find(function(x){return x.id===klusdagId;});
  if(!k){ toast('Dag niet gevonden'); return; }
  var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===klusdagId;}).map(function(p){return p.naam;});
  var veilig=S.data.taken.filter(function(t){return t.klusdag_id===klusdagId && t.is_veiligheid && t.status!=='klaar';});
  var nogdoen=S.data.taken.filter(function(t){return t.klusdag_id===klusdagId && !t.is_veiligheid && t.status!=='klaar';});
  var regel=S.data.items.filter(function(i){return i.klusdag_id===klusdagId;});
  var regels=[];
  regels.push('Klusdag '+dnl(k.datum)+(k.starttijd?' · start '+String(k.starttijd).slice(0,5):''));
  if(k.doel) regels.push('Doel: '+k.doel);
  regels.push('');
  regels.push('Ploeg: '+(ploeg.length?ploeg.join(', '):'nog niemand'));
  if(veilig.length){ regels.push(''); regels.push('Veiligheid:'); veilig.forEach(function(t){ regels.push('- '+t.titel); }); }
  if(nogdoen.length){ regels.push(''); regels.push('Nog te doen:'); nogdoen.forEach(function(t){ regels.push('- '+t.titel+(t.trekker?' ('+t.trekker+')':'')); }); }
  if(regel.length){ regels.push(''); regels.push('Regelen/meenemen:'); regel.forEach(function(i){ regels.push('- '+i.naam+(i.nodig_voor?' (vóór '+dnl(i.nodig_voor)+')':'')+' — '+i.status.replace('_',' ')); }); }
  var r=regels.join(NL);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(r).then(function(){ toast('Dagbriefing gekopieerd'); }).catch(function(){ toast('Kopiëren niet gelukt'); });
  } else { toast('Kopiëren niet ondersteund in deze browser'); }
}

var TITELS = {fases:'Fase',mijlpalen:'Mijlpaal',klusdagen:'Klusdag',posten:'Budgetpost',taken:'Taak',items:'Benodigdheid',offertes:'Offerte',besluiten:'Besluit',documenten:'Document',notities:'Notitie'};
var VERPLICHT = {fases:'naam',mijlpalen:'titel',klusdagen:'datum',posten:'naam',taken:'titel',items:'naam',offertes:'leverancier',besluiten:'titel',documenten:'naam',notities:'titel'};
function openForm(table, id){
  var rec = id ? S.data[table].find(function(x){return x.id===id;}) : {};
  var pan=document.getElementById('mpaneel');
  pan.innerHTML='';
  var h3=document.createElement('h3'); h3.textContent=(id?'Bewerk ':'Nieuwe ')+TITELS[table].toLowerCase(); pan.appendChild(h3);
  var velden={};
  FORMS[table].forEach(function(f){
    var lab=document.createElement('label'); lab.textContent=f[2]; pan.appendChild(lab);
    var el;
    if(f[1]==='area'){ el=document.createElement('textarea'); }
    else if(f[1]==='fase'){
      el=document.createElement('select');
      var o0=document.createElement('option'); o0.value=''; o0.textContent='Algemeen'; el.appendChild(o0);
      S.data.fases.forEach(function(fs){ var o=document.createElement('option'); o.value=String(fs.nummer); o.textContent=fs.nummer+'. '+fs.naam; el.appendChild(o); });
    }
    else if(f[1]==='klusdag'){
      el=document.createElement('select');
      var ok0=document.createElement('option'); ok0.value=''; ok0.textContent='Nog niet gepland'; el.appendChild(ok0);
      S.data.klusdagen.forEach(function(kd){ var o=document.createElement('option'); o.value=kd.id; o.textContent=klusdagLabel(kd); el.appendChild(o); });
    }
    else if(f[1]==='boolsel'){
      el=document.createElement('select');
      [['false','Nee'],['true','Ja']].forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; el.appendChild(op); });
    }
    else if(f[1].indexOf('select:')===0){
      el=document.createElement('select');
      f[1].slice(7).split(',').forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v.replace('_',' '); el.appendChild(o); });
    }
    else{ el=document.createElement('input'); el.type=(f[1]==='datum')?'date':(f[1]==='tijd'?'time':'text'); if(f[1]==='geld'||f[1]==='number') el.inputMode='decimal'; }
    var val=rec[f[0]];
    if(f[1]==='boolsel'){ el.value = val===true?'true':'false'; }
    else if(f[1]==='tijd'){ el.value = val? String(val).slice(0,5) : ''; }
    else { el.value = val==null?'':String(val); }
    velden[f[0]]=[el,f[1]]; pan.appendChild(el);
  });
  if(table==='posten' && id) renderBetalingenSectie(pan, id);
  var kn=document.createElement('div'); kn.className='knoppen';
  if(id && table!=='fases'){ var del=document.createElement('button'); del.className='del'; del.textContent='Wis'; del.onclick=function(){ if(confirm('Verwijderen?')) api({action:'delete',table:table,id:id}).then(function(){sluit();laad();}).catch(function(e){toast(e.message);}); }; kn.appendChild(del); }
  var ann=document.createElement('button'); ann.textContent='Annuleer'; ann.onclick=sluit; kn.appendChild(ann);
  var ok=document.createElement('button'); ok.className='prim'; ok.textContent='Bewaar';
  ok.onclick=function(){
    var data={};
    Object.keys(velden).forEach(function(k){
      var v=velden[k][0].value, tp=velden[k][1];
      if(tp==='geld'||tp==='number') data[k]=num(v);
      else if(tp==='fase') data[k]= v===''?null:+v;
      else if(tp==='boolsel') data[k]= (v==='true');
      else data[k]= (typeof v==='string'&&v.trim()==='')?null:v;
    });
    if(!data[VERPLICHT[table]]){ toast('Vul een naam in'); return; }
    var call = id? {action:'update',table:table,id:id,data:data} : {action:'insert',table:table,data:data};
    api(call).then(function(){sluit();laad();}).catch(function(e){toast(e.message);});
  };
  kn.appendChild(ok); pan.appendChild(kn);
  document.getElementById('modal').className='show';
}
