<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EAE0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236B7052'/%3E%3Cpath d='M32 15 L51 32 H45 V49 H36 V39 H28 V49 H19 V32 H13 Z' fill='%23F1EAE0'/%3E%3C/svg%3E">
<title>Verbouwhub</title>
<style>
:root{--zand:#F1EAE0;--card:#FBF7F0;--ink:#2E2921;--ink2:#7A7062;--olijf:#6B7052;--klei:#B4674E;--honing:#BE9055;--lijn:#E2D8C6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--zand);color:var(--ink);font:15px/1.5 system-ui,'Segoe UI',sans-serif;padding-bottom:78px;overscroll-behavior-y:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header{padding:18px 0 2px}
header h1{font-size:19px;font-weight:650}
main{padding:12px 0 18px;min-height:60vh}
.card{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.kop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 6px}
.kop h2{font-size:14px;font-weight:650}
.kop .som{font-size:13px;color:var(--ink2)}
.groot{font-size:30px;font-weight:700;letter-spacing:-.5px}
.mut{color:var(--ink2);font-size:12.5px}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--lijn);background:#F5EFE4;color:var(--ink2);white-space:nowrap;cursor:pointer}
.chip.groen{background:#E9EBE0;border-color:#C9CDB4;color:#4C513A}
.chip.klei{background:#F2E3DC;border-color:#DDBBAD;color:#8C4A35}
.chip.honing{background:#F3E8D5;border-color:#DFC9A3;color:#8A6428}
.chip.actief{background:var(--olijf);border-color:var(--olijf);color:#FDFBF6;font-weight:600}
.subnav{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.open{background:#D9CDB8}.dot.akkoord{background:var(--honing)}.dot.betaald{background:var(--olijf)}
.catkop{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 4px;font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:#8A8574;font-weight:650}
.catkop .cs{font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:650}
.tabel{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:2px 12px}
.trij{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid #EFE7D8}
.trij:first-child{border-top:0}
.trij .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trij .tm{color:var(--ink2);font-size:11.5px}
.trij .tb{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.trij.subs .tb{color:var(--olijf)}
.balkwrap{background:#EADFCE;border-radius:6px;height:8px;overflow:hidden;margin-top:6px}
.balk{height:100%;background:var(--olijf);border-radius:6px}
.mijlp{display:flex;gap:9px;align-items:baseline;padding:7px 0;border-top:1px solid #EFE7D8;cursor:pointer;font-size:14px}
.mijlp:first-child{border-top:0}
.ruit{color:var(--klei);font-size:13px;flex:0 0 auto}
.matrixwrap{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:10px;overflow-x:auto}
.matrix{display:grid;gap:3px;font-size:12px;min-width:460px}
.mkop{font-weight:650;text-align:center;font-size:11.5px;padding:4px 2px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.mkop.actief{background:var(--olijf);color:#FDFBF6}
.mrij{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 2px;cursor:pointer}
.mcel{text-align:center;border-radius:6px;padding:4px 1px;font-size:11px;cursor:pointer;background:#F5EFE4;color:#B4AC9A}
.mcel.vol{background:#F3E8D5;color:#8A6428;font-weight:600}
.mcel.kl{background:#E9EBE0;color:#4C513A;text-decoration:line-through}
.mveilig{color:#8C4A35}
.addbtn{position:fixed;right:16px;bottom:76px;width:52px;height:52px;border-radius:50%;background:var(--klei);color:#FDFBF6;border:0;font-size:27px;line-height:1;cursor:pointer;z-index:30;box-shadow:0 2px 8px rgba(46,41,33,.25)}
.botnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--lijn);display:grid;grid-template-columns:repeat(5,1fr);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.botnav button{background:none;border:0;padding:9px 2px 8px;font:inherit;font-size:10.5px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.botnav button.on{color:var(--olijf);font-weight:650}
.botnav button.sidesub{display:none}
.taak{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid #EFE7D8}
.taak:first-child{border-top:0}
.taak input{width:18px;height:18px;margin-top:2px;accent-color:var(--olijf);flex:0 0 auto}
.taak .tt{cursor:pointer}
.taak.klaar .tt{color:var(--ink2);text-decoration:line-through}
.leeg{color:var(--ink2);text-align:center;padding:26px 0}
#overlay,#modal{position:fixed;inset:0;background:rgba(46,41,33,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#overlay.show,#modal.show{display:flex}
.paneel{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.paneel h3{font-size:17px;margin-bottom:12px}
.paneel label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 3px}
.paneel input,.paneel select,.paneel textarea{width:100%;padding:9px 10px;border:1px solid var(--lijn);border-radius:8px;background:#FFFDF8;font:inherit;font-size:15px;color:var(--ink)}
.paneel textarea{min-height:74px;resize:vertical}
.knoppen{display:flex;gap:8px;margin-top:16px}
.knoppen button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--lijn);background:#F5EFE4;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.knoppen .prim{background:var(--olijf);border-color:var(--olijf);color:#FDFBF6;font-weight:600}
.knoppen .del{background:none;border-color:#DDBBAD;color:var(--klei);flex:0 0 auto;padding:11px 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#FDFBF6;padding:9px 16px;border-radius:9px;font-size:14px;display:none;z-index:50}
.pinvak{text-align:center}
.pinvak input{font-size:22px;text-align:center;letter-spacing:6px;margin-top:8px}
.subs{color:var(--olijf);font-weight:600}
.loc{font-size:12px;color:var(--ink2);background:#F5EFE4;border-radius:6px;padding:3px 8px;display:inline-block;margin-top:5px;word-break:break-all}
.veilig{background:#F2E3DC;border:1px solid #DDBBAD;border-radius:9px;padding:2px 10px;margin:8px 0}
.veilig .taak{border-top-color:#E7CFC1}
.veilig .taak:first-child{border-top:0}
.betrij{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--lijn);font-size:13.5px}
.betrij:first-of-type{border-top:0}
.betnieuw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.betnieuw input{padding:7px 8px;font-size:13px}
.bestrij{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--lijn);font-size:13px}
.bestrij:first-of-type{border-top:0}
.bestrij a{color:var(--ink);text-decoration:underline;cursor:pointer}
label.upl{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:8px;border:1px dashed var(--lijn);background:#F5EFE4;color:var(--ink2);font-size:12.5px;cursor:pointer;text-align:center;width:100%}
label.upl input{display:none}
.alert{background:#F2E3DC;border:1px solid #DDBBAD;border-radius:10px;padding:9px 12px;margin-bottom:10px}
.alert b{color:#8C4A35;font-size:13px}
.alert div{font-size:12.5px;color:#8C4A35;margin-top:2px}
.dagdetail{border:1px solid var(--lijn);border-left:3px solid var(--olijf);border-radius:12px;background:var(--card);padding:13px 14px;margin-top:10px}
.dekking{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.dkaart{background:var(--card);border:1px solid var(--lijn);border-radius:10px;padding:8px 10px}
.dkaart.dkpos{background:#E9EBE0;border-color:#C9CDB4}
.dkaart.dkneg{background:#F2E3DC;border-color:#DDBBAD}
.dklabel{font-size:9px;color:var(--ink2);letter-spacing:.4px;text-transform:uppercase}
.dkgroot{font-size:16px;font-weight:650}
.dkneg .dkgroot{color:#8C4A35}
.dksub{font-size:10px;color:var(--ink2);margin-top:1px}
.editcel{cursor:text;border-bottom:1px dashed transparent}
.editcel:hover{border-bottom-color:var(--ink2)}
.editcel input{width:70px;border:1.5px solid var(--olijf);border-radius:5px;padding:1px 4px;font:inherit;font-size:inherit;background:#FFFDF8;text-align:right}
.editcel.voorlopig{color:var(--ink2);font-weight:500;font-style:italic}
.editcel.voorlopig:hover{border-bottom-color:var(--klei)}
.trij.nieuw{padding:6px 0}
.trij-sd,.sdkop{display:none}
@media(min-width:900px){
  body{padding-bottom:0}
  .botnav{left:0;right:auto;top:0;bottom:0;width:150px;grid-template-columns:1fr;grid-auto-rows:min-content;background:#454a3c;border-top:0;border-right:1px solid #363a2f;padding:14px 6px;gap:1px;align-content:start}
  .botnav button{color:#B8B2A0;padding:8px 10px;flex-direction:row;justify-content:flex-start;text-align:left;font-size:13px}
  .botnav button.on{background:#6B7052;color:#FDFBF6;border-radius:8px}
  .botnav button.sidesub{display:flex;font-size:11.5px;padding:5px 10px 5px 22px;color:#9B9683}
  .botnav button.sidesub.on{background:#565c49;color:#FDFBF6;border-radius:6px;font-weight:500}
  .wrap{margin-left:150px;max-width:1100px}
  .addbtn{left:auto;right:24px;bottom:24px}
  .dekking{max-width:560px}
  .rij{grid-template-columns:1fr auto auto;align-items:center}
  .twee{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .subnav{display:none}
  .trij-compact{display:none}
  .trij-sd{display:grid;grid-template-columns:14px 2fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center}
  .sdkop{display:grid;grid-template-columns:14px 2fr 1fr 1fr 1fr 1fr;gap:10px;padding:0 12px 4px;font-size:10px;letter-spacing:.5px;color:#8A8574}
  .sdkop span:not(:first-child):not(:nth-child(2)){text-align:right}
  .sdcel{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  .sdcel.editcel input{width:76px}
}
</style>
</head>
<body>
<div class="wrap"><header><h1>Verbouwhub</h1></header><main id="main"><div class="leeg">Laden…</div></main></div>
<nav class="botnav" id="botnav"></nav>
<button class="addbtn" id="addbtn">+</button>
<div id="overlay"><div class="paneel pinvak"><h3>Verbouwhub</h3><div class="mut">Voer de pincode in</div><input id="pininput" inputmode="numeric" autocomplete="off" placeholder="••••••"><div class="knoppen"><button class="prim" id="pinok">Openen</button></div></div></div>
<div id="modal"><div class="paneel" id="mpaneel"></div></div>
<div id="toast"></div>
<script>
var API = 'https://joqjslpebnpgghoybdar.supabase.co/functions/v1/verbouw/api';
var SUPA_URL = 'https://joqjslpebnpgghoybdar.supabase.co';
var TOPTABS = [['start','Start'],['plannen','Plannen'],['doen','Doen'],['geld','Geld'],['dossier','Dossier']];
var S = { data:null, tab:'start', subtabs:{doen:'taken',geld:'overzicht',dossier:'besluiten'}, klusdagFocus:null, klaarOpen:false, pin: localStorage.getItem('vb_pin') || '' };
var EUR0 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var EUR2 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
var DNL = new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',year:'numeric'});
var DNLKORT = new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'short'});
var DNLDAG = new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'numeric'});
function eur(n,dec){ if(n==null||isNaN(n)) return '—'; return (dec?EUR2:EUR0).format(n); }
function dnl(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); return isNaN(d)?'':DNL.format(d); }
function dnlk(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); return isNaN(d)?'':DNLKORT.format(d); }
function klusdagLabel(k){ var d=new Date(k.datum+'T00:00:00'); return isNaN(d)?k.datum:DNLKORT.format(d); }
function dagKort(k){ var d=new Date(k.datum+'T00:00:00'); return isNaN(d)?k.datum:DNLDAG.format(d); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function plusDagenISO(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtBytes(n){ if(n==null) return ''; if(n<1024) return n+' B'; if(n<1024*1024) return Math.round(n/1024)+' KB'; return (n/1024/1024).toFixed(1)+' MB'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v==null) return null; var s=String(v).trim(); if(s==='') return null; var n=parseFloat(s.replace(',','.')); return isNaN(n)?null:n; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';},2600); }
function best(p){ if(p.werkelijk!=null) return +p.werkelijk; if(p.offerte!=null) return +p.offerte; if(p.begroot!=null) return +p.begroot; return null; }
function bestVeld(p){ if(p.werkelijk!=null) return 'werkelijk'; if(p.offerte!=null) return 'offerte'; return 'begroot'; }
function betaaldVoorPost(postId){ var t=0; (S.data.betalingen||[]).forEach(function(b){ if(b.post_id===postId && b.status==='betaald') t+=+b.bedrag; }); return t; }
function openDeadline(postId){ var l=(S.data.betalingen||[]).filter(function(b){return b.post_id===postId && b.status!=='betaald' && b.datum;}); if(!l.length) return null; l.sort(function(a,b){return a.datum<b.datum?-1:1;}); return l[0]; }
function dekkingRij(){ return (S.data.dekking && S.data.dekking[0]) || {id:1}; }

function api(body){
  body.pin = S.pin;
  return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    if(r.status===401){ showPin(true); throw new Error('Pincode onjuist'); }
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Er ging iets mis'); return j; });
  });
}
function laad(){ return api({action:'all'}).then(function(d){ S.data=d; render(); }).catch(function(e){ if(String(e.message).indexOf('Pincode')<0) toast(e.message); }); }
function showPin(fout){ document.getElementById('overlay').className='show'; var inp=document.getElementById('pininput'); inp.value=''; inp.focus(); if(fout) toast('Pincode onjuist'); }
document.getElementById('pinok').onclick = probeerPin;
document.getElementById('pininput').addEventListener('keydown',function(e){ if(e.key==='Enter') probeerPin(); });
function probeerPin(){ S.pin = document.getElementById('pininput').value.trim(); localStorage.setItem('vb_pin', S.pin); document.getElementById('overlay').className=''; laad(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden && S.data) laad(); });

function huidigeStaat(){ return {tab:S.tab, subtabs:Object.assign({},S.subtabs)}; }
function gaNaarTab(tab){ if(S.tab===tab){ window.scrollTo(0,0); return; } S.tab=tab; history.pushState(huidigeStaat(),'','#'+tab); render(); window.scrollTo(0,0); }
function gaNaarSubtab(tab, sub){ S.tab=tab; S.subtabs[tab]=sub; history.pushState(huidigeStaat(),'','#'+tab+'-'+sub); render(); }
window.addEventListener('popstate', function(e){ if(e.state){ S.tab=e.state.tab; S.subtabs=Object.assign(S.subtabs, e.state.subtabs||{}); } else { S.tab='start'; } render(); });

function render(){
  var nav=document.getElementById('botnav'); nav.innerHTML='';
  TOPTABS.forEach(function(t){
    var b=document.createElement('button'); if(S.tab===t[0]) b.className='on'; b.textContent=t[1]; b.onclick=function(){ gaNaarTab(t[0]); }; nav.appendChild(b);
    if(t[0]==='geld' && S.tab==='geld'){
      GELDSUBS.forEach(function(gs){ var sb=document.createElement('button'); sb.className='sidesub'+(S.subtabs.geld===gs[0]?' on':''); sb.textContent=gs[1]; sb.onclick=function(){ gaNaarSubtab('geld',gs[0]); }; nav.appendChild(sb); });
    }
  });
  var m=document.getElementById('main');
  if(!S.data){ m.innerHTML='<div class="leeg">Laden…</div>'; return; }
  var r={start:rStart,plannen:rPlannen,doen:rDoen,geld:rGeld,dossier:rDossier};
  m.innerHTML=r[S.tab]();
  koppel(m);
}
function subnav(groep, items){
  var actief=S.subtabs[groep];
  var h='<div class="subnav">';
  items.forEach(function(it){ h+='<span class="chip'+(actief===it[0]?' actief':'')+'" data-subtab="'+groep+':'+it[0]+'">'+it[1]+'</span>'; });
  return h+'</div>';
}
function hypotheekSom(){ var t=0; (S.data.hypotheekdelen||[]).forEach(function(h){ t+=+h.bedrag; }); return t; }
function berekenFinancien(){
  var dk=dekkingRij(); var aankoop=0, verbouw=0, subsidie=0, betaald=0;
  S.data.posten.forEach(function(p){
    var bb=best(p);
    if(p.type==='subsidie'){ if(bb!=null) subsidie+=bb; }
    else{ if(bb!=null){ if(p.categorie==='Aankoop & advies') aankoop+=bb; else verbouw+=bb; } betaald+=betaaldVoorPost(p.id); }
  });
  var verbouwNetto=verbouw-subsidie;
  var financiering=hypotheekSom()+(+dk.eigen_geld||0)+(+dk.verduurzaming||0);
  var koopsom=+dk.koopsom||0;
  var huisKosten=koopsom+aankoop;
  var verbouwbudget=financiering-huisKosten;
  var netto=aankoop+verbouwNetto;
  return { financiering:financiering, koopsom:koopsom, aankoop:aankoop, huisKosten:huisKosten, verbouwbudget:verbouwbudget, verbouw:verbouw, subsidie:subsidie, verbouwNetto:verbouwNetto, ruimte:verbouwbudget-verbouwNetto, netto:netto, betaald:betaald, openstaand:netto-betaald };
}
function openTaken(){ return S.data.taken.filter(function(t){return t.status!=='klaar';}).slice().sort(function(a,b){ return (a.volgorde||100)-(b.volgorde||100); }); }

function rStart(){
  var vandaag=todayISO(); var over7=plusDagenISO(7); var alerts=[];
  (S.data.betalingen||[]).forEach(function(b){
    if(b.status!=='betaald' && b.datum){
      var post=S.data.posten.find(function(p){return p.id===b.post_id;});
      var naam=post?post.naam:'betaling';
      if(b.datum<vandaag) alerts.push(eur(+b.bedrag,true)+' — '+naam+' — is over tijd (vóór '+dnlk(b.datum)+')');
      else if(b.datum<=over7) alerts.push(eur(+b.bedrag,true)+' betalen vóór '+dnlk(b.datum)+' — '+naam);
    }
  });
  S.data.items.forEach(function(i){ if(i.nodig_voor && i.nodig_voor<vandaag && i.status==='nodig') alerts.push(i.naam+' had geregeld moeten zijn vóór '+dnlk(i.nodig_voor)); });
  var eerstK=S.data.klusdagen.filter(function(k){return k.datum>=vandaag;})[0];
  if(eerstK){ var ploegC=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===eerstK.id;}).length; var takenC=S.data.taken.filter(function(t){return t.klusdag_id===eerstK.id;}).length; if(!ploegC && takenC) alerts.push(klusdagLabel(eerstK)+' heeft nog niemand ingepland'); }
  var h='';
  if(alerts.length){ h+='<div class="alert"><b>⚠ '+alerts.length+' ding'+(alerts.length===1?'':'en')+' vraagt aandacht</b>'; alerts.slice(0,4).forEach(function(a){ h+='<div>'+esc(a)+'</div>'; }); if(alerts.length>4) h+='<div>… en nog '+(alerts.length-4)+'</div>'; h+='</div>'; }
  var vm=S.data.mijlpalen.filter(function(m){return m.status!=='gehaald';})[0];
  h+='<div class="card">';

function kopieerDagbriefing(klusdagId){
  var NL=String.fromCharCode(10);
  var k=S.data.klusdagen.find(function(x){return x.id===klusdagId;});
  if(!k){ toast('Dag niet gevonden'); return; }

  var veilig=S.data.taken.filter(function(t){return t.klusdag_id===klusdagId && t.is_veiligheid && t.status!=='klaar';});
  var nogdoen=S.data.taken.filter(function(t){return t.klusdag_id===klusdagId && !t.is_veiligheid && t.status!=='klaar';});
  var regel=S.data.items.filter(function(i){return i.klusdag_id===klusdagId;});
  var regels=[];
  regels.push('Klusdag '+dnl(k.datum)+(k.starttijd?' · start '+String(k.starttijd).slice(0,5):''));
  if(k.doel) regels.push('Doel: '+k.doel); regels.push(''); regels.push('Ploeg: '+(ploeg.length?ploeg.join(', '):'nog niemand'));
  if(veilig.length){ regels.push(''); regels.push('Veiligheid:'); veilig.forEach(function(t){ regels.push('- '+t.titel); }); }
  if(nogdoen.length){ regels.push(''); regels.push('Nog te doen:'); nogdoen.forEach(function(t){ regels.push('- '+t.titel+(t.trekker?' ('+t.trekker+')':'')); }); }
  if(regel.length){ regels.push(''); regels.push('Regelen/meenemen:'); regel.forEach(function(i){ regels.push('- '+i.naam+(i.nodig_voor?' (vóór '+dnl(i.nodig_voor)+')':'')+' — '+i.status.replace('_',' ')); }); }
  var r=regels.join(NL);
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(r).then(function(){ toast('Dagbriefing gekopieerd'); }).catch(function(){ toast('Kopiëren niet gelukt'); }); }
  else { toast('Kopiëren niet ondersteund in deze browser'); }
}

var FORMS = {
  fases:[['naam','text','Fase-naam*'],['start','datum','Start'],['eind','datum','Eind'],['status','select:gepland,bezig,klaar','Status'],['notitie','area','Notitie']],
  mijlpalen:[['titel','text','Mijlpaal*'],['datum','datum','Datum'],['status','select:gepland,gehaald','Status'],['notitie','area','Notitie']],
  klusdagen:[['datum','datum','Datum*'],['doel','text','Doel van de dag'],['starttijd','tijd','Starttijd'],['status','select:gepland,gesloten','Status'],['notitie','area','Notitie']],
  posten:[['naam','text','Naam*'],['categorie','catsel','Categorie'],['ruimte','text','Ruimte'],['leverancier','text','Leverancier'],['type','select:kosten,subsidie','Type'],['begroot','geld','Begroot € (incl. btw)'],['offerte','geld','Offerte €'],['werkelijk','geld','Werkelijk €'],['status','select:open,akkoord,betaald','Status'],['notitie','area','Notitie']],
  taken:[['titel','text','Taak*'],['klusdag_id','klusdag','Klusdag'],['trekker','text','Wie pakt dit op'],['is_veiligheid','boolsel','Veiligheidsstap'],['status','select:open,bezig,klaar','Status'],['volgorde','number','Volgorde'],['notitie','area','Notitie']],
  items:[['naam','text','Wat*'],['soort','select:kopen,huren,regelen,meenemen','Soort'],['klusdag_id','klusdag','Nodig op klusdag'],['nodig_voor','datum','Nodig vóór (deadline)'],['aantal','text','Aantal'],['prijs','geld','Prijs €'],['status','select:nodig,besteld,in_huis','Status'],['winkel','text','Winkel'],['ruimte','text','Ruimte'],['notitie','area','Notitie']],
  offertes:[['leverancier','text','Leverancier*'],['nummer','text','Offertenummer'],['omschrijving','text','Omschrijving'],['bedrag','geld','Bedrag € incl. btw'],['status','select:ontvangen,vergelijken,akkoord,afgewezen,onvolledig','Status'],['contact','text','Contact'],['notitie','area','Notitie']],
  besluiten:[['titel','text','Besluit*'],['datum','datum','Datum'],['waarom','area','Waarom / onderbouwing']],
  documenten:[['naam','text','Document*'],['soort','text','Soort (offerte, rapport…)'],['locatie','text','Waar ligt het'],['eind_datum','datum','Garantie tot (optioneel)'],['notitie','area','Notitie']],
  notities:[['titel','text','Titel*'],['tekst','area','Tekst']],
  hypotheekdelen:[['naam','text','Naam*'],['bedrag','geld','Bedrag €'],['rente','geld','Rente %'],['eind_datum','text','Vast tot (bv. 09-2036)'],['volgorde','number','Volgorde'],['notitie','area','Notitie']]
};
var TITELS = {fases:'Fase',mijlpalen:'Mijlpaal',klusdagen:'Klusdag',posten:'Budgetpost',taken:'Taak',items:'Benodigdheid',offertes:'Offerte',besluiten:'Besluit',documenten:'Document',notities:'Notitie',hypotheekdelen:'Hypotheekdeel'};
var VERPLICHT = {fases:'naam',mijlpalen:'titel',klusdagen:'datum',posten:'naam',taken:'titel',items:'naam',offertes:'leverancier',besluiten:'titel',documenten:'naam',notities:'titel',hypotheekdelen:'naam'};
function openForm(table, id){
  var rec = id ? S.data[table].find(function(x){return x.id===id;}) : {};
  var pan=document.getElementById('mpaneel'); pan.innerHTML='';
  var h3=document.createElement('h3'); h3.textContent=(id?'Bewerk ':'Nieuwe ')+TITELS[table].toLowerCase(); pan.appendChild(h3);
  var velden={};
  var CATS2=['Aankoop & advies','Sloop & voorbereiding','Isolatie & kozijnen','Verwarming & installaties','Wanden & afwerking','Keuken & badkamer','Vloeren & inrichting','Overig','Subsidies'];
  FORMS[table].forEach(function(f){
    var lab=document.createElement('label'); lab.textContent=f[2]; pan.appendChild(lab);
    var el;
    if(f[1]==='area'){ el=document.createElement('textarea'); }
    else if(f[1]==='catsel'){ el=document.createElement('select'); CATS2.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; el.appendChild(o); }); }
    else if(f[1]==='klusdag'){ el=document.createElement('select'); var ok0=document.createElement('option'); ok0.value=''; ok0.textContent='Nog niet gepland'; el.appendChild(ok0); S.data.klusdagen.forEach(function(kd){ var o=document.createElement('option'); o.value=kd.id; o.textContent=klusdagLabel(kd); el.appendChild(o); }); }
    else if(f[1]==='boolsel'){ el=document.createElement('select'); [['false','Nee'],['true','Ja']].forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1]; el.appendChild(op); }); }
    else if(f[1].indexOf('select:')===0){ el=document.createElement('select'); f[1].slice(7).split(',').forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v.replace('_',' '); el.appendChild(o); }); }
    else{ el=document.createElement('input'); el.type=(f[1]==='datum')?'date':(f[1]==='tijd'?'time':'text'); if(f[1]==='geld'||f[1]==='number') el.inputMode='decimal'; }
    var val=rec[f[0]];
    if(f[1]==='boolsel'){ el.value = val===true?'true':'false'; }
    else if(f[1]==='tijd'){ el.value = val? String(val).slice(0,5) : ''; }
    else if(f[1]==='catsel'){ el.value = val||'Overig'; }
    else { el.value = val==null?'':String(val); }
    velden[f[0]]=[el,f[1]]; pan.appendChild(el);
  });
  if(table==='posten' && id) renderBetalingenSectie(pan, id);
  var kn=document.createElement('div'); kn.className='knoppen';
  if(id && table!=='fases'){ var del=document.createElement('button'); del.className='del'; del.textContent='Wis'; del.onclick=function(){ if(confirm('Verwijderen?')) api({action:'delete',table:table,id:id}).then(function(){sluit();laad();}).catch(function(e){toast(e.message);}); }; kn.appendChild(del); }
  var ann=document.createElement('button'); ann.textContent='Annuleer'; ann.onclick=sluit; kn.appendChild(ann);
  var ok=document.createElement('button'); ok.className='prim'; ok.textContent='Bewaar';
  ok.onclick=function(){
    var data={};
    Object.keys(velden).forEach(function(k){ var v=velden[k][0].value, tp=velden[k][1]; if(tp==='geld'||tp==='number') data[k]=num(v); else if(tp==='boolsel') data[k]= (v==='true'); else data[k]= (typeof v==='string'&&v.trim()==='')?null:v; });
    if(!data[VERPLICHT[table]]){ toast('Vul een naam in'); return; }
    var call = id? {action:'update',table:table,id:id,data:data} : {action:'insert',table:table,data:data};
    api(call).then(function(){sluit();laad();}).catch(function(e){toast(e.message);});
  };
  kn.appendChild(ok); pan.appendChild(kn); document.getElementById('modal').className='show';
}
function sluit(){ document.getElementById('modal').className=''; }
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') sluit(); });
document.getElementById('addbtn').onclick=function(){
  var geldMap={offertes:'offertes',hypotheek:'hypotheekdelen',overzicht:'posten',budget:'posten'};
  var map={ start:'taken', plannen:'klusdagen', doen: S.subtabs.doen==='spullen'?'items':'taken', geld: geldMap[S.subtabs.geld]||'posten', dossier: S.subtabs.dossier==='documenten'?'documenten':(S.subtabs.dossier==='notities'?'notities':'besluiten') };
  openForm(map[S.tab], null);
};

history.replaceState(huidigeStaat(),'','#start');
render();
if(!S.pin){ showPin(false); } else { laad(); }
</script>
