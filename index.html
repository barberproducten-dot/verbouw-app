<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EAE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1913" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236B7052'/%3E%3Cpath d='M32 15 L51 32 H45 V49 H36 V39 H28 V49 H19 V32 H13 Z' fill='%23F1EAE0'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Verbouwhub">
<title>Verbouwhub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light dark}
:root{--zand:#F1EAE0;--card:#FBF7F0;--card2:#F5EEE3;--ink:#2E2921;--ink2:#7A7062;--ink3:#A89C8A;--olijf:#6B7052;--olijf-l:#E3E5D6;--olijf-t:#3E4230;--klei:#B4674E;--klei-l:#F3DFD7;--klei-t:#6E3A2A;--honing:#BE9055;--honing-l:#F2E6D2;--honing-t:#6A4C22;--lijn:#E1D6C4;--wit:#FFFDF9;--serif:'Fraunces',Georgia,serif;--sans:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--zand:#1D1913;--card:#28231C;--card2:#302A22;--ink:#EFE6D8;--ink2:#B0A28E;--ink3:#7E7362;--olijf:#A3AB84;--olijf-l:#343A29;--olijf-t:#D5DBBD;--klei:#D28D74;--klei-l:#4A2F25;--klei-t:#F0C9B9;--honing:#D6AB6E;--honing-l:#463823;--honing-t:#F0D7AE;--lijn:#43392D;--wit:#2E2820}}
:root[data-theme="dark"]{--zand:#1D1913;--card:#28231C;--card2:#302A22;--ink:#EFE6D8;--ink2:#B0A28E;--ink3:#7E7362;--olijf:#A3AB84;--olijf-l:#343A29;--olijf-t:#D5DBBD;--klei:#D28D74;--klei-l:#4A2F25;--klei-t:#F0C9B9;--honing:#D6AB6E;--honing-l:#463823;--honing-t:#F0D7AE;--lijn:#43392D;--wit:#2E2820}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--zand);color:var(--ink);font:15px/1.55 var(--sans);padding-bottom:78px;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header{padding:20px 0 4px}
header h1{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em}
main{padding:14px 0 20px;min-height:60vh}
.card{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:14px 16px;margin-bottom:11px}
.kop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 7px}
.kop h2{font-family:var(--serif);font-size:16px;font-weight:500}
.kop .som{font-size:12.5px;color:var(--ink2);font-family:var(--mono)}
.groot{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mut{color:var(--ink2);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--lijn);background:var(--card2);color:var(--ink2);white-space:nowrap;cursor:pointer}
.chip.groen{background:var(--olijf-l);border-color:var(--olijf-l);color:var(--olijf-t)}
.chip.klei{background:var(--klei-l);border-color:var(--klei-l);color:var(--klei-t)}
.chip.honing{background:var(--honing-l);border-color:var(--honing-l);color:var(--honing-t)}
.chip.actief{background:var(--olijf);border-color:var(--olijf);color:var(--wit);font-weight:600}
.subnav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.open{background:var(--lijn)}.dot.akkoord{background:var(--honing)}.dot.betaald{background:var(--olijf)}
.catkop{display:flex;justify-content:space-between;align-items:baseline;padding:13px 2px 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.catkop .cs{font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;font-family:var(--mono)}
.tabel{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:2px 14px}
.trij{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--lijn)}
.trij:first-child{border-top:0}
.trij .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trij .tm{color:var(--ink2);font-size:11.5px}
.trij .tb{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.trij.subs .tb{color:var(--olijf-t)}
.balkwrap{background:var(--card2);border-radius:6px;height:7px;overflow:hidden;margin-top:7px}
.balk{height:100%;background:var(--olijf);border-radius:6px}
.mijlp{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-top:1px solid var(--lijn);cursor:pointer;font-size:14px}
.mijlp:first-child{border-top:0}
.ruit{color:var(--klei);font-size:13px;flex:0 0 auto}
.matrixwrap{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:10px;overflow-x:auto}
.matrix{display:grid;gap:3px;font-size:12px;min-width:460px}
.mkop{font-weight:600;text-align:center;font-size:11.5px;padding:4px 2px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.mkop.actief{background:var(--olijf);color:var(--wit)}
.mrij{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 2px;cursor:pointer}
.mcel{text-align:center;border-radius:6px;padding:4px 1px;font-size:11px;cursor:pointer;background:var(--card2);color:var(--ink3);font-family:var(--mono)}
.mcel.vol{background:var(--honing-l);color:var(--honing-t);font-weight:600}
.mcel.kl{background:var(--olijf-l);color:var(--olijf-t);text-decoration:line-through}
.mveilig{color:var(--klei-t)}
.addbtn{position:fixed;right:16px;bottom:76px;width:52px;height:52px;border-radius:50%;background:var(--klei);color:var(--wit);border:0;font-size:27px;line-height:1;cursor:pointer;z-index:30;box-shadow:0 4px 14px rgba(46,41,33,.22)}
.botnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--lijn);display:grid;grid-template-columns:repeat(5,1fr);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.botnav button{background:none;border:0;padding:9px 2px 8px;font:inherit;font-size:10.5px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.botnav button.on{color:var(--olijf-t);font-weight:600}
.botnav button.sidesub{display:none}
.taak{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--lijn)}
.taak:first-child{border-top:0}
.taak input{width:17px;height:17px;margin-top:2px;accent-color:var(--olijf);flex:0 0 auto}
.taak .tt{cursor:pointer}
.taak.klaar .tt{color:var(--ink2);text-decoration:line-through}
.leeg{color:var(--ink2);text-align:center;padding:28px 0;font-size:13.5px}
#overlay,#modal{position:fixed;inset:0;background:rgba(46,41,33,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#overlay.show,#modal.show{display:flex}
.paneel{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.paneel h3{font-family:var(--serif);font-weight:500;font-size:19px;margin-bottom:12px}
.paneel label{display:block;font-size:12px;letter-spacing:.02em;color:var(--ink2);margin:11px 0 4px}
.paneel input,.paneel select,.paneel textarea{width:100%;padding:9px 10px;border:1px solid var(--lijn);border-radius:8px;background:var(--wit);font:inherit;font-size:15px;color:var(--ink)}
.paneel textarea{min-height:74px;resize:vertical}
.knoppen{display:flex;gap:8px;margin-top:18px}
.knoppen button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--lijn);background:var(--card2);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.knoppen .prim{background:var(--olijf);border-color:var(--olijf);color:var(--wit);font-weight:600}
.knoppen .del{background:none;border-color:var(--klei-l);color:var(--klei);flex:0 0 auto;padding:11px 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--wit);padding:9px 16px;border-radius:9px;font-size:14px;display:none;z-index:50}
.pinvak{text-align:center}
.pinvak input{font-size:22px;text-align:center;letter-spacing:6px;margin-top:8px;font-family:var(--mono)}
.subs{color:var(--olijf-t);font-weight:600}
.loc{font-size:12px;color:var(--ink2);background:var(--card2);border-radius:6px;padding:3px 8px;display:inline-block;margin-top:5px;word-break:break-all}
.veilig{background:var(--klei-l);border-left:3px solid var(--klei);border-radius:9px;padding:2px 12px;margin:9px 0}
.veilig .taak{border-top-color:var(--klei-l)}
.veilig .taak:first-child{border-top:0}
.veilig .tt{color:var(--klei-t)}
.betrij{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--lijn);font-size:13.5px}
.betrij:first-of-type{border-top:0}
.betnieuw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.betnieuw input{padding:7px 8px;font-size:13px}
.bestrij{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--lijn);font-size:13px}
.bestrij:first-of-type{border-top:0}
.bestrij a{color:var(--ink);text-decoration:underline;cursor:pointer}
label.upl{display:inline-block;margin-top:8px;padding:9px 12px;border-radius:8px;border:1px dashed var(--lijn);background:var(--card2);color:var(--ink2);font-size:12.5px;cursor:pointer;text-align:center;width:100%}
label.upl input{display:none}
.alert{background:var(--klei-l);border-left:3px solid var(--klei);border-radius:10px;padding:10px 13px;margin-bottom:11px}
.alert b{color:var(--klei-t);font-size:13px}
.alert div{font-size:12.5px;color:var(--klei-t);margin-top:2px}
.dagdetail{border:1px solid var(--lijn);border-left:3px solid var(--olijf);border-radius:12px;background:var(--card);padding:14px 16px;margin-top:11px}
.dekking{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.dkaart{background:var(--card);border:1px solid var(--lijn);border-radius:10px;padding:8px 10px}
.dkaart.dkpos{background:var(--olijf-l);border-color:var(--olijf-l)}
.dkaart.dkneg{background:var(--klei-l);border-color:var(--klei-l)}
.dklabel{font-size:9px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.dkgroot{font-family:var(--mono);font-size:16px;font-weight:600}
.dkneg .dkgroot{color:var(--klei-t)}
.dksub{font-size:10px;color:var(--ink2);margin-top:1px}
.editcel{cursor:text;border-bottom:1px dashed transparent}
.editcel:hover{border-bottom-color:var(--ink2)}
.editcel input{width:70px;border:1.5px solid var(--olijf);border-radius:5px;padding:1px 4px;font:inherit;font-size:inherit;background:var(--wit);text-align:right}
.editcel.voorlopig{color:var(--ink2);font-weight:500;font-style:italic}
.editcel.voorlopig:hover{border-bottom-color:var(--klei)}
.trij.nieuw{padding:6px 0}
.begrij{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--lijn);font-size:13.5px;cursor:pointer}
.begrij:first-of-type{border-top:0}
.begrij:hover span:first-child{color:var(--olijf-t)}
.trij-sd,.sdkop{display:none}

/* overzicht: weekstrip, aandacht, fase-tijdlijn, staaf */
.ovzgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:11px;margin-top:0}
.ovk{background:var(--card);border:1px solid var(--lijn);border-radius:12px;padding:13px 14px}
.ovk h4{font-family:var(--serif);font-weight:500;font-size:14.5px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline}
.ovk h4 span{font-family:var(--sans);font-weight:500;font-size:11.5px;color:var(--ink2)}
.weekstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wstd{background:var(--card2);border-radius:8px;padding:7px 6px;font-size:11px;cursor:pointer}
.wstd.vandaag{box-shadow:inset 0 0 0 1.5px var(--olijf)}
.wstd b{font-family:var(--mono);font-size:12.5px;display:block}
.wstd .m{color:var(--ink2);display:block;margin-top:1px}
.wstd .m.klei{color:var(--klei-t);font-weight:600}
.wstd .dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.wstd .dots i{width:6px;height:6px;border-radius:50%;background:var(--olijf);display:block}
.wstd .dots i.g{background:var(--klei)}
.aandacht{display:grid;gap:6px}
.aand-r{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:6px 8px;border-radius:7px;background:var(--card2)}
.aand-r.klei{background:var(--klei-l);color:var(--klei-t)}
.aand-r.honing{background:var(--honing-l);color:var(--honing-t)}
.aand-r .w{margin-left:auto;font-size:11px;font-family:var(--mono);white-space:nowrap;opacity:.85}
.staaf{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--card2);margin-top:9px}
.staaf i{display:block;height:100%}
.staaf i.w{background:var(--olijf)}
.staaf i.o{background:var(--honing)}
.staaf i.b{background:var(--ink3);opacity:.5}
.staaflegenda{display:flex;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--ink2);margin-top:7px}
.staaflegenda i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.open3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.open3 .ovk{padding:12px 13px}
.open3 .ovk .trij{padding:4px 0;font-size:12.5px}
.mijlpstrip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px}
.mijlpstrip span{cursor:pointer;color:var(--ink2)}
.mijlpstrip span.klaar{text-decoration:line-through}
@media(max-width:760px){.ovzgrid{grid-template-columns:1fr}.weekstrip{grid-template-columns:repeat(5,minmax(56px,1fr));overflow-x:auto}.open3{grid-template-columns:1fr}}

@media(min-width:900px){
  body{padding-bottom:0}
  .botnav{left:0;right:auto;top:0;bottom:0;width:154px;grid-template-columns:1fr;grid-auto-rows:min-content;background:var(--card2);border-top:0;border-right:1px solid var(--lijn);padding:16px 7px;gap:1px;align-content:start}
  .botnav button{color:var(--ink2);padding:8px 10px;flex-direction:row;justify-content:flex-start;text-align:left;font-size:13px}
  .botnav button.on{background:var(--olijf);color:var(--wit);border-radius:8px}
  .botnav button.sidesub{display:flex;font-size:11.5px;padding:5px 10px 5px 22px;color:var(--ink3)}
  .botnav button.sidesub.on{background:var(--olijf-l);color:var(--olijf-t);border-radius:6px;font-weight:500}
  .wrap{margin-left:154px;max-width:1100px}
  .addbtn{left:auto;right:24px;bottom:24px}
  .dekking{max-width:560px}
  .rij{grid-template-columns:1fr auto auto;align-items:center}
  .twee{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .subnav{display:none}
  .trij-compact{display:none}
  .trij-sd{display:grid;grid-template-columns:14px 2fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center}
  .sdkop{display:grid;grid-template-columns:14px 2fr 1fr 1fr 1fr 1fr;gap:10px;padding:0 12px 4px;font-size:10px;letter-spacing:.08em;color:var(--ink2)}
  .sdkop span:not(:first-child):not(:nth-child(2)){text-align:right}
  .sdcel{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
  .sdcel.editcel{color:var(--ink2)}
  .sdcel.editcel:hover{color:var(--ink);border-bottom:1px dashed var(--olijf)}
  .sdcel.editcel input{width:76px}
  .sdtotaal{padding:3px 12px;border-top:1px solid var(--lijn);margin-top:2px}
  .sdtotaal span{font-weight:600;font-size:12px}
  .sdtotaal span:nth-child(2){color:var(--ink2);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
}
</style>
</head>
<body>
<div class="wrap"><header><h1>Verbouwhub</h1></header><main id="main"><div class="leeg">Laden…</div></main></div>
<nav class="botnav" id="botnav"></nav>
<button class="addbtn" id="addbtn">+</button>
<div id="overlay"><div class="paneel pinvak"><h3>Verbouwhub</h3><div class="mut">Voer de pincode in</div><input id="pininput" inputmode="numeric" autocomplete="off" placeholder="••••••"><div class="knoppen"><button class="prim" id="pinok">Openen</button></div></div></div>
<div id="modal"><div class="paneel" id="mpaneel"></div></div>
<div id="toast"></div>
<script>
var API = 'https://joqjslpebnpgghoybdar.supabase.co/functions/v1/verbouw/api';
var SUPA_URL = 'https://joqjslpebnpgghoybdar.supabase.co';
var TOPTABS = [['start','Start'],['plannen','Plannen'],['doen','Doen'],['geld','Geld'],['dossier','Dossier']];
var S = { data:null, tab:'start', subtabs:{doen:'taken',geld:'overzicht',dossier:'besluiten'}, klusdagFocus:null, faseFocus:null, klaarOpen:false, pin: localStorage.getItem('vb_pin') || '' };
var EUR0 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var EUR2 = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
var DNL = new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',year:'numeric'});
var DNLKORT = new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'short'});
var DNLDAG = new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'numeric',month:'numeric'});
function eur(n,dec){ if(n==null||isNaN(n)) return '—'; return (dec?EUR2:EUR0).format(n); }
function dnl(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); return isNaN(d)?'':DNL.format(d); }
function dnlk(s){ if(!s) return ''; var d=new Date(s+'T00:00:00'); return isNaN(d)?'':DNLKORT.format(d); }
function klusdagLabel(k){ var d=new Date(k.datum+'T00:00:00'); return isNaN(d)?k.datum:DNLKORT.format(d); }
function dagKort(k){ var d=new Date(k.datum+'T00:00:00'); return isNaN(d)?k.datum:DNLDAG.format(d); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function plusDagenISO(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtBytes(n){ if(n==null) return ''; if(n<1024) return n+' B'; if(n<1024*1024) return Math.round(n/1024)+' KB'; return (n/1024/1024).toFixed(1)+' MB'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ if(v==null) return null; var s=String(v).trim(); if(s==='') return null; var n=parseFloat(s.replace(',','.')); return isNaN(n)?null:n; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';},2600); }
function best(p){ if(p.werkelijk!=null) return +p.werkelijk; if(p.offerte!=null) return +p.offerte; if(p.begroot!=null) return +p.begroot; return null; }
function bestVeld(p){ if(p.werkelijk!=null) return 'werkelijk'; if(p.offerte!=null) return 'offerte'; return 'begroot'; }
function betaaldVoorPost(postId){ var t=0; (S.data.betalingen||[]).forEach(function(b){ if(b.post_id===postId && b.status==='betaald') t+=+b.bedrag; }); return t; }
function openDeadline(postId){ var l=(S.data.betalingen||[]).filter(function(b){return b.post_id===postId && b.status!=='betaald' && b.datum;}); if(!l.length) return null; l.sort(function(a,b){return a.datum<b.datum?-1:1;}); return l[0]; }
function dekkingRij(){ return (S.data.dekking && S.data.dekking[0]) || {id:1}; }

function api(body){
  body.pin = S.pin;
  return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){
    if(r.status===401){ showPin(true); throw new Error('Pincode onjuist'); }
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Er ging iets mis'); return j; });
  });
}
function laad(){ return api({action:'all'}).then(function(d){ S.data=d; render(); }).catch(function(e){ if(String(e.message).indexOf('Pincode')<0) toast(e.message); }); }
function showPin(fout){ document.getElementById('overlay').className='show'; var inp=document.getElementById('pininput'); inp.value=''; inp.focus(); if(fout) toast('Pincode onjuist'); }
document.getElementById('pinok').onclick = probeerPin;
document.getElementById('pininput').addEventListener('keydown',function(e){ if(e.key==='Enter') probeerPin(); });
function probeerPin(){ S.pin = document.getElementById('pininput').value.trim(); localStorage.setItem('vb_pin', S.pin); document.getElementById('overlay').className=''; laad(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden && S.data) laad(); });

function huidigeStaat(){ return {tab:S.tab, subtabs:Object.assign({},S.subtabs)}; }
function gaNaarTab(tab){ if(S.tab===tab){ window.scrollTo(0,0); return; } S.tab=tab; history.pushState(huidigeStaat(),'','#'+tab); render(); window.scrollTo(0,0); }
function gaNaarSubtab(tab, sub){ S.tab=tab; S.subtabs[tab]=sub; history.pushState(huidigeStaat(),'','#'+tab+'-'+sub); render(); }
window.addEventListener('popstate', function(e){ if(e.state){ S.tab=e.state.tab; S.subtabs=Object.assign(S.subtabs, e.state.subtabs||{}); } else { S.tab='start'; } render(); });

var SIDESUBS = {
  doen: [['taken','Taken'],['spullen','Spullen'],['acties','Mijn acties']],
  dossier: [['besluiten','Besluiten'],['documenten','Docs'],['notities','Notities']]
};
function render(){
  var nav=document.getElementById('botnav'); nav.innerHTML='';
  TOPTABS.forEach(function(t){
    var b=document.createElement('button'); if(S.tab===t[0]) b.className='on'; b.textContent=t[1]; b.onclick=function(){ gaNaarTab(t[0]); }; nav.appendChild(b);
    if(t[0]==='geld' && S.tab==='geld'){
      GELDSUBS.forEach(function(gs){ var sb=document.createElement('button'); sb.className='sidesub'+(S.subtabs.geld===gs[0]?' on':''); sb.textContent=gs[1]; sb.onclick=function(){ gaNaarSubtab('geld',gs[0]); }; nav.appendChild(sb); });
    }
    if(SIDESUBS[t[0]] && S.tab===t[0]){
      SIDESUBS[t[0]].forEach(function(gs){ var sb=document.createElement('button'); sb.className='sidesub'+(S.subtabs[t[0]]===gs[0]?' on':''); sb.textContent=gs[1]; sb.onclick=function(){ gaNaarSubtab(t[0],gs[0]); }; nav.appendChild(sb); });
    }
  });
  var m=document.getElementById('main');
  if(!S.data){ m.innerHTML='<div class="leeg">Laden…</div>'; return; }
  var r={start:rStart,plannen:rPlannen,doen:rDoen,geld:rGeld,dossier:rDossier};
  m.innerHTML=r[S.tab]();
  koppel(m);
}
function subnav(groep, items){
  var actief=S.subtabs[groep];
  var h='<div class="subnav">';
  items.forEach(function(it){ h+='<span class="chip'+(actief===it[0]?' actief':'')+'" data-subtab="'+groep+':'+it[0]+'">'+it[1]+'</span>'; });
  return h+'</div>';
}
function hypotheekSom(){ var t=0; (S.data.hypotheekdelen||[]).forEach(function(h){ if(!h.is_overbrugging) t+=+h.bedrag; }); return t; }
function overbruggingSom(){ var t=0; (S.data.hypotheekdelen||[]).forEach(function(h){ if(h.is_overbrugging) t+=+h.bedrag; }); return t; }
function berekenFinancien(){
  var dk=dekkingRij(); var aankoop=0, verbouw=0, subsidie=0, betaald=0;
  S.data.posten.forEach(function(p){
    var bb=best(p);
    if(p.type==='subsidie'){ if(bb!=null) subsidie+=bb; }
    else{ if(bb!=null){ if(p.categorie==='Aankoop & advies') aankoop+=bb; else verbouw+=bb; } betaald+=betaaldVoorPost(p.id); }
  });
  var verbouwNetto=verbouw-subsidie;
  var hyp=hypotheekSom(), overbrugging=overbruggingSom();
  var verkoop=+dk.eigen_geld||0, verduurzaming=+dk.verduurzaming||0, depot=+dk.hypotheek_bouwdepot||0;
  var financiering=hyp+overbrugging+verkoop;
  var koopsom=+dk.koopsom||0, restschuld=+dk.restschuld_oud||0;
  var aflossingen=restschuld+overbrugging;
  var klusbudget=financiering-koopsom-aflossingen-aankoop-verduurzaming;
  var vrijUitVerkoop=verkoop-restschuld-overbrugging;
  var marge=klusbudget-vrijUitVerkoop-depot;
  var netto=aankoop+verbouwNetto;
  return { hyp:hyp, overbrugging:overbrugging, verkoop:verkoop, verduurzaming:verduurzaming, depot:depot, financiering:financiering, koopsom:koopsom, restschuld:restschuld, aflossingen:aflossingen, aankoop:aankoop, verbouwbudget:klusbudget, vrijUitVerkoop:vrijUitVerkoop, marge:marge, verbouw:verbouw, subsidie:subsidie, verbouwNetto:verbouwNetto, ruimte:klusbudget-verbouwNetto, netto:netto, betaald:betaald, openstaand:netto-betaald };
}
function openTaken(){ return S.data.taken.filter(function(t){return t.status!=='klaar';}).slice().sort(function(a,b){ return (a.volgorde||100)-(b.volgorde||100); }); }

function rStart(){
  var vandaag=todayISO(); var over7=plusDagenISO(7); var alerts=[];
  (S.data.betalingen||[]).forEach(function(b){
    if(b.status!=='betaald' && b.datum){
      var post=S.data.posten.find(function(p){return p.id===b.post_id;});
      var naam=post?post.naam:'betaling';
      if(b.datum<vandaag) alerts.push(eur(+b.bedrag,true)+' — '+naam+' — is over tijd (vóór '+dnlk(b.datum)+')');
      else if(b.datum<=over7) alerts.push(eur(+b.bedrag,true)+' betalen vóór '+dnlk(b.datum)+' — '+naam);
    }
  });
  S.data.items.forEach(function(i){ if(i.nodig_voor && i.nodig_voor<vandaag && i.status==='nodig') alerts.push(i.naam+' had geregeld moeten zijn vóór '+dnlk(i.nodig_voor)); });
  (S.data.acties||[]).forEach(function(a){ if(a.status!=='klaar' && a.deadline && a.deadline<vandaag) alerts.push(a.titel+' — actie is over tijd (vóór '+dnlk(a.deadline)+')'); });
  var eerstK=S.data.klusdagen.filter(function(k){return k.datum>=vandaag;})[0];
  if(eerstK){ var ploegC=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===eerstK.id;}).length; var takenC=S.data.taken.filter(function(t){return t.klusdag_id===eerstK.id;}).length; if(!ploegC && takenC) alerts.push(klusdagLabel(eerstK)+' heeft nog niemand ingepland'); }
  var h='';
  var vm=S.data.mijlpalen.filter(function(m){return m.status!=='gehaald';})[0];
  var komendeDagen=S.data.klusdagen.filter(function(k){return k.datum>=vandaag;}).slice(0,5);
  h+='<div class="ovzgrid">';
  h+='<div class="ovk"><h4>Deze week<span>'+komendeDagen.length+' klusdagen</span></h4>';
  if(komendeDagen.length){
    h+='<div class="weekstrip">';
    komendeDagen.forEach(function(k,i){
      var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===k.id;});
      var taken=S.data.taken.filter(function(t){return t.klusdag_id===k.id;});
      var veiligOpen=taken.filter(function(t){return t.is_veiligheid && t.status!=='klaar';}).length;
      h+='<div class="wstd'+(i===0?' vandaag':'')+'" data-goto-day="'+k.id+'" data-goto="plannen"><b>'+esc(dagKort(k))+'</b>';
      h+='<span class="m'+(!ploeg.length&&taken.length?' klei':'')+'">'+(ploeg.length?ploeg.length+' mensen':(taken.length?'niemand':'—'))+'</span>';
      if(taken.length){ var klaarC=taken.filter(function(t){return t.status==='klaar';}).length; h+='<span class="dots">'; for(var d=0;d<Math.min(taken.length,5);d++) h+='<i'+(d<veiligOpen?' class="g"':'')+'></i>'; h+='</span>'; }
      h+='</div>';
    });
    h+='</div>';
  } else h+='<div class="mut">Nog geen klusdagen gepland</div>';
  if(vm) h+='<div style="margin-top:11px;padding-top:9px;border-top:1px solid var(--lijn);display:flex;justify-content:space-between;gap:8px"><span><span class="ruit">◆</span> <b>'+esc(vm.titel)+'</b></span><span class="mut mono">'+(vm.datum?dnl(vm.datum):'datum invullen')+'</span></div>';
  h+='</div>';
  h+='<div class="ovk"><h4>Wat nu aandacht vraagt<span>'+alerts.length+'</span></h4>';
  if(alerts.length){
    h+='<div class="aandacht">';
    alerts.slice(0,5).forEach(function(a){ h+='<div class="aand-r klei">'+esc(a)+'</div>'; });
    if(alerts.length>5) h+='<div class="mut" style="padding:2px 8px">… en nog '+(alerts.length-5)+'</div>';
    h+='</div>';
  } else h+='<div class="mut">Niets dat om aandacht vraagt ✔</div>';
  h+='</div></div>';
  h+='<div class="kop"><h2>Nu doen</h2><span class="som" data-goto="doen" style="cursor:pointer">alles →</span></div><div class="tabel">';
  var open=openTaken().slice(0,5);
  if(!open.length) h+='<div class="leeg">Alles klaar ✔</div>';
  open.forEach(function(t){ h+='<div class="trij" data-edit="taken:'+t.id+'"><span class="dot open"></span><span class="tn">'+(t.is_veiligheid?'⚠ ':'')+esc(t.titel)+'</span></div>'; });
  h+='</div>';
  var s=berekenFinancien();
  h+='<div class="kop"><h2>Geld</h2><span class="som" data-goto="geld" style="cursor:pointer">detail →</span></div>';
  h+='<div class="card" data-goto="geld" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="groot" style="font-size:24px">'+eur(s.netto)+'</span><span class="mut">betaald '+eur(s.betaald)+' · open <b style="color:var(--klei)">'+eur(s.openstaand)+'</b></span></div>';
  h+='<div class="balkwrap"><div class="balk" style="width:'+Math.max(0,Math.min(100,Math.round(s.betaald/(s.netto||1)*100)))+'%"></div></div>';
  if(s.financiering>0) h+='<div class="mut" style="margin-top:4px">verbouwbudget '+eur(s.verbouwbudget)+' — ruimte <b style="color:'+(s.ruimte<0?'var(--klei)':'var(--olijf)')+'">'+(s.ruimte<0?'−':'+')+eur(Math.abs(s.ruimte))+'</b></div>';
  h+='</div>';
  var lb=S.data.besluiten[0];
  if(lb) h+='<div class="kop"><h2>Laatste besluit</h2></div><div class="card" data-edit="besluiten:'+lb.id+'" style="cursor:pointer"><b>'+esc(lb.titel)+'</b><div class="mut" style="margin-top:2px">'+dnl(lb.datum)+'</div></div>';
  return h;
}

function kiesDefaultFase(){
  var vandaag=todayISO();
  var dagenMetFase=S.data.klusdagen.filter(function(k){return k.fase!=null;}).slice().sort(function(a,b){return a.datum<b.datum?-1:1;});
  var aankomend=dagenMetFase.filter(function(k){return k.datum>=vandaag;})[0];
  if(aankomend) return aankomend.fase;
  if(dagenMetFase.length) return dagenMetFase[dagenMetFase.length-1].fase;
  return (S.data.fases[0]||{}).nummer;
}
function rPlanning(){
  var vandaag=todayISO();
  var h='';
  if(S.data.mijlpalen.length){
    h+='<div class="mijlpstrip">';
    S.data.mijlpalen.forEach(function(m){ h+='<span data-edit="mijlpalen:'+m.id+'"'+(m.status==='gehaald'?' class="klaar"':'')+'><span class="ruit">◆</span> '+esc(m.titel)+(m.datum?' — '+dnl(m.datum):'')+'</span>'; });
    h+='</div>';
  }
  if(!S.data.fases.length) return h+'<div class="leeg">Nog geen fases aangemaakt</div>';
  if(S.faseFocus==null || !S.data.fases.some(function(f){return f.nummer===S.faseFocus;})) S.faseFocus=kiesDefaultFase();
  h+='<div class="subnav">';
  S.data.fases.forEach(function(f){ h+='<span class="chip'+(f.nummer===S.faseFocus?' actief':'')+'" data-fase-kies="'+f.nummer+'">'+f.nummer+'. '+esc(f.naam)+'</span>'; });
  h+='</div>';
  var fase=S.data.fases.find(function(f){return f.nummer===S.faseFocus;});
  if(!fase) return h;
  var dagenVanFase=S.data.klusdagen.filter(function(k){return k.fase===fase.nummer;}).slice().sort(function(a,b){return a.datum<b.datum?-1:1;});
  var takenVanFase=S.data.taken.filter(function(t){return t.fase===fase.nummer;});
  var ongeplandTaken=takenVanFase.filter(function(t){return !t.klusdag_id && t.status!=='klaar';});
  var itemsVanFase=S.data.items.filter(function(i){return i.fase===fase.nummer;});
  var ongeplandItems=itemsVanFase.filter(function(i){return !i.klusdag_id;});
  var besluitenVanFase=S.data.besluiten.filter(function(b){return b.fase===fase.nummer;});
  var docsVanFase=S.data.documenten.filter(function(d){return d.fase===fase.nummer && !d.klusdag_id;});

  h+='<div class="kop" style="margin-top:0"><h2>Fase '+fase.nummer+' van '+S.data.fases.length+' — '+esc(fase.naam)+'</h2><span class="chip" data-edit="fases:'+fase.id+'" style="cursor:pointer">'+esc(fase.status)+'</span></div>';
  if(fase.notitie) h+='<div class="mut" style="margin-bottom:10px">'+esc(fase.notitie)+'</div>';

  h+='<div class="ovzgrid">';
  h+='<div class="ovk"><h4>Klusdagen<span>'+dagenVanFase.length+'</span></h4>';
  if(dagenVanFase.length){
    h+='<div class="weekstrip" style="grid-template-columns:repeat('+Math.min(dagenVanFase.length,7)+',1fr)">';
    dagenVanFase.forEach(function(k){
      var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===k.id;});
      var taken=S.data.taken.filter(function(t){return t.klusdag_id===k.id;});
      h+='<div class="wstd'+(k.datum===vandaag?' vandaag':'')+'" data-goto-day="'+k.id+'"><b>'+esc(dagKort(k))+'</b>';
      h+='<span class="m'+(!ploeg.length&&taken.length?' klei':'')+'">'+(ploeg.length?ploeg.length+' mensen':(taken.length?'niemand':'—'))+'</span>';
      h+='</div>';
    });
    h+='</div>';
  } else h+='<div class="mut">Nog geen klusdagen in deze fase</div>';
  h+='</div>';

  var alerts=[];
  dagenVanFase.forEach(function(k){
    var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===k.id;});
    var taken=S.data.taken.filter(function(t){return t.klusdag_id===k.id;});
    if(!ploeg.length && taken.length) alerts.push(dagKort(k)+' heeft nog niemand ingepland');
    taken.filter(function(t){return t.is_veiligheid && t.status!=='klaar';}).forEach(function(t){ alerts.push('Veiligheid: '+t.titel+' ('+dagKort(k)+')'); });
  });
  itemsVanFase.forEach(function(i){ if(i.nodig_voor && i.nodig_voor<vandaag && i.status==='nodig') alerts.push(i.naam+' had geregeld moeten zijn vóór '+dnlk(i.nodig_voor)); });
  h+='<div class="ovk"><h4>Wat nu aandacht vraagt<span>'+alerts.length+'</span></h4>';
  if(alerts.length){ h+='<div class="aandacht">'; alerts.slice(0,6).forEach(function(a){ h+='<div class="aand-r klei">'+esc(a)+'</div>'; }); h+='</div>'; }
  else h+='<div class="mut">Niets dat om aandacht vraagt ✔</div>';
  h+='</div></div>';

  h+='<div class="kop"><h2>Dag voor dag</h2></div>';
  if(!dagenVanFase.length) h+='<div class="leeg">Nog geen klusdagen — gebruik + om er een toe te voegen</div>';
  dagenVanFase.forEach(function(k){ h+='<div id="dag-'+k.id+'">'+rDagdetail(k, vandaag)+'</div>'; });
  h+='<div class="trij nieuw" data-nieuwe-klusdag="'+fase.nummer+'" style="background:var(--card);border:1px solid var(--lijn);border-radius:10px;padding:8px 12px;margin-top:8px"><span class="tn" style="color:var(--olijf);cursor:pointer">+ klusdag toevoegen</span></div>';

  h+='<div class="kop"><h2>Openstaand voor deze fase</h2></div>';
  h+='<div class="open3">';
  h+='<div class="ovk"><h4>Nog in te plannen<span>'+ongeplandTaken.length+'</span></h4>';
  if(ongeplandTaken.length) ongeplandTaken.forEach(function(t){ h+='<div class="trij"><span class="tn" data-edit="taken:'+t.id+'" style="cursor:pointer">'+(t.is_veiligheid?'⚠ ':'')+esc(t.titel)+'</span></div>'; });
  else h+='<div class="mut">Niets openstaand</div>';
  h+='<span class="tn" style="color:var(--olijf);cursor:pointer;font-size:12.5px;display:block;margin-top:4px" data-nieuwe-taak-fase="'+fase.nummer+'">+ klus</span>';
  h+='</div>';

  h+='<div class="ovk"><h4>Regelen<span>'+ongeplandItems.length+'</span></h4>';
  if(ongeplandItems.length) ongeplandItems.forEach(function(i){ var cls=i.status==='in_huis'?'groen':(i.status==='besteld'?'honing':''); h+='<div class="trij"><span class="tn" data-edit="items:'+i.id+'" style="cursor:pointer">'+esc(i.naam)+'</span><span class="chip '+cls+'" data-cycle="'+i.id+'">'+esc(i.status.replace('_',' '))+'</span></div>'; });
  else h+='<div class="mut">Niets openstaand</div>';
  h+='<span class="tn" style="color:var(--olijf);cursor:pointer;font-size:12.5px;display:block;margin-top:4px" data-nieuw-item-fase="'+fase.nummer+'">+ spullen/regelen</span>';
  h+='</div>';

  h+='<div class="ovk"><h4>Beslissen<span>'+besluitenVanFase.length+'</span></h4>';
  if(besluitenVanFase.length) besluitenVanFase.forEach(function(b){ h+='<div class="trij"><span class="tn" data-edit="besluiten:'+b.id+'" style="cursor:pointer">'+esc(b.titel)+'</span></div>'; });
  else h+='<div class="mut">Niets openstaand</div>';
  h+='<span class="tn" style="color:var(--olijf);cursor:pointer;font-size:12.5px;display:block;margin-top:4px" data-nieuw-besluit-fase="'+fase.nummer+'">+ besluit</span>';
  h+='</div>';
  h+='</div>';

  h+='<div class="kop"><h2>Links &amp; documenten van deze fase</h2></div><div class="tabel">';
  if(docsVanFase.length) docsVanFase.forEach(function(d){ h+='<div class="trij"><span class="tn">'+esc(d.naam)+'</span><a href="'+esc(d.locatie||'#')+'" target="_blank" rel="noopener" class="chip" style="text-decoration:none">open ↗</a></div>'; });
  else h+='<div class="mut" style="padding:6px 0">Nog geen losse links voor deze fase — een link bij een specifieke dag plak je bij die dag hierboven</div>';
  h+='<input type="text" placeholder="Plak een link voor deze fase…" data-link-plak-fase="'+fase.nummer+'" style="width:100%;margin-top:8px;border:1px dashed var(--lijn);border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px;background:transparent;color:var(--ink)">';
  h+='</div>';

  return h;
}
function rDagdetail(k, vandaag){
  var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===k.id;});
  var taken=S.data.taken.filter(function(t){return t.klusdag_id===k.id;});
  var veilig=taken.filter(function(t){return t.is_veiligheid;});
  var gelukt=taken.filter(function(t){return !t.is_veiligheid && t.status==='klaar';});
  var nogdoen=taken.filter(function(t){return !t.is_veiligheid && t.status!=='klaar';});
  var items=S.data.items.filter(function(i){return i.klusdag_id===k.id;});
  var bevindingen=S.data.bevindingen.filter(function(b){return b.klusdag_id===k.id;});
  var h='<div class="dagdetail">';
  h+='<div style="cursor:pointer" data-edit="klusdagen:'+k.id+'"><b>'+klusdagLabel(k)+(k.doel?' — '+esc(k.doel):'')+'</b>'+(k.starttijd?'<span class="mut"> · start '+esc(String(k.starttijd).slice(0,5))+'</span>':'<span class="mut"> · doel/starttijd instellen →</span>')+'</div>';

function rActies(){
  var vandaag=todayISO();
  var lijst=(S.data.acties||[]);
  var groepen={todo:[],uit:[],wacht:[],bev:[],klaar:[]};
  lijst.forEach(function(a){ (groepen[a.status]||groepen.todo).push(a); });
  var open=lijst.filter(function(a){return a.status!=='klaar';}).length;
  var laat=lijst.filter(function(a){return a.status!=='klaar' && a.deadline && a.deadline<vandaag;}).length;
  var h='<div class="mut" style="margin-bottom:6px">'+open+' open'+(laat?' · <b style="color:var(--klei)">'+laat+' te laat</b>':'')+'</div>';
  var volgorde=['wacht','uit','todo','bev','klaar']; var leeg=true;
  volgorde.forEach(function(st){
    var g=groepen[st]; if(!g.length) return; leeg=false;
    h+='<div class="kop" style="margin-top:14px"><h2>'+ACTIE_GROEP[st]+'</h2><span class="som">'+g.length+'</span></div><div class="tabel">';
    g.forEach(function(a){
      var over=a.deadline && a.deadline<vandaag && a.status!=='klaar';
      var wachtInfo='';

        var d1=new Date(a.uitgezet_op+'T00:00:00'), d2=new Date(vandaag+'T00:00:00');

        if(dagen>=0) wachtInfo=' <span class="tm"'+(dagen>=4?' style="color:var(--klei);font-weight:650"':'')+'>· wacht '+dagen+' dag'+(dagen===1?'':'en')+'</span>';

      h+='<span class="tb tm" style="'+(over?'color:var(--klei);font-weight:650':'')+'">'+(a.deadline?dnlk(a.deadline):'')+'</span>';

function kopieerDagbriefing(klusdagId){
  var NL=String.fromCharCode(10);
  var k=S.data.klusdagen.find(function(x){return x.id===klusdagId;});
  if(!k){ toast('Dag niet gevonden'); return; }
  var ploeg=S.data.klusdag_ploeg.filter(function(p){return p.klusdag_id===klusdagId;}).map(function(p){return p.naam;});
  var veilig=S.data.taken.filter(function(t){return t.klusdag_id===klusdagId && t.is_veiligheid && t.status!=='klaar';});
  var nogdoen=S.data.taken.filter(function(t){return t.klusdag_id===klusdagId && !t.is_veiligheid && t.status!=='klaar';});
  var regel=S.data.items.filter(function(i){return i.klusdag_id===klusdagId;});
  var regels=[];
  regels.push('Klusdag '+dnl(k.datum)+(k.starttijd?' · start '+String(k.starttijd).slice(0,5):''));
  if(k.doel) regels.push('Doel: '+k.doel); regels.push(''); regels.push('Ploeg: '+(ploeg.length?ploeg.join(', '):'nog niemand'));
  if(veilig.length){ regels.push(''); regels.push('Veiligheid:'); veilig.forEach(function(t){ regels.push('- '+t.titel); }); }
  if(nogdoen.length){ regels.push(''); regels.push('Nog te doen:'); nogdoen.forEach(function(t){ regels.push('- '+t.titel+(t.trekker?' ('+t.trekker+')':'')); }); }
  if(regel.length){ regels.push(''); regels.push('Regelen/meenemen:'); regel.forEach(function(i){ regels.push('- '+i.naam+(i.nodig_voor?' (vóór '+dnl(i.nodig_voor)+')':'')+' — '+i.status.replace('_',' ')); }); }
  var r=regels.join(NL);
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(r).then(function(){ toast('Dagbriefing gekopieerd'); }).catch(function(){ toast('Kopiëren niet gelukt'); }); }
  else { toast('Kopiëren niet ondersteund in deze browser'); }
}

  var ann=document.createElement('button'); ann.textContent='Annuleer'; ann.onclick=sluit; kn.appendChild(ann);
  var ok=document.createElement('button'); ok.className='prim'; ok.textContent='Bewaar';
  ok.onclick=function(){
    var data={};
    Object.keys(velden).forEach(function(k){ var v=velden[k][0].value, tp=velden[k][1]; if(tp==='geld'||tp==='number'||tp==='faseSel') data[k]=num(v); else if(tp==='boolsel') data[k]= (v==='true'); else data[k]= (typeof v==='string'&&v.trim()==='')?null:v; });
    if(!data[VERPLICHT[table]]){ toast('Vul een naam in'); return; }
    var call = id? {action:'update',table:table,id:id,data:data} : {action:'insert',table:table,data:data};
    api(call).then(function(){sluit();laad();}).catch(function(e){toast(e.message);});
  };
  kn.appendChild(ok); pan.appendChild(kn); document.getElementById('modal').className='show';
}
function sluit(){ document.getElementById('modal').className=''; }
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') sluit(); });
document.getElementById('addbtn').onclick=function(){
  var geldMap={offertes:'offertes',hypotheek:'hypotheekdelen',overzicht:'posten',budget:'posten'};
  var doenMap={spullen:'items',acties:'acties'};
  var map={ start:'taken', plannen:'klusdagen', doen: doenMap[S.subtabs.doen]||'taken', geld: geldMap[S.subtabs.geld]||'posten', dossier: S.subtabs.dossier==='documenten'?'documenten':(S.subtabs.dossier==='notities'?'notities':'besluiten') };
  var defaults = (S.tab==='plannen' && S.faseFocus!=null) ? {fase:S.faseFocus} : null;
  openForm(map[S.tab], null, defaults);
};

history.replaceState(huidigeStaat(),'','#start');
render();
if(!S.pin){ showPin(false); } else { laad(); }
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
